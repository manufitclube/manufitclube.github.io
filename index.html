  <!-- Tailwind CSS -->

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'Inter', 'sans-serif']
          }
        }
      }
    };
  </script>

  <!-- Fontes Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --bg-subtle: #f1f5f9;
      --border-card: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
    }

    html.dark {
      --bg-page: #0d1117;
      --bg-card: #161b22;
      --bg-subtle: #1f242c;
      --border-card: #30363d;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .font-display {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
    }

    .card-box {
      background-color: var(--bg-card);
      border: 1px solid var(--border-card);
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    /* Único elemento sticky no topo durante a rolagem dos treinos */
    .cronometro-sticky {
      position: sticky;
      top: 8px;
      z-index: 30;
      background-color: #ffffff;
      box-shadow: 0 12px 28px -6px rgba(15, 23, 42, 0.14);
    }

    html.dark .cronometro-sticky {
      background-color: #161b22;
      box-shadow: 0 14px 32px -6px rgba(0, 0, 0, 0.72);
    }

    .hero-treino-grad {
      background: linear-gradient(135deg, #7c3aed 0%, #2563eb 52%, #06b6d4 100%);
    }

    /* Remove setas nativas dos inputs numéricos */
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }
  </style>
</head>

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return createDefaultData();
          const parsed = JSON.parse(raw);
          if (!parsed || !parsed.profiles || !parsed.activeProfileId) {
            return createDefaultData();
          }
          return parsed;
        } catch (err) {
          return createDefaultData();
        }
      }

      let state = loadState();

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

        msg.textContent = text;
        box.classList.remove('opacity-0', '-translate-y-3');
        box.classList.add('opacity-100', 'translate-y-0');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
          box.classList.add('opacity-0', '-translate-y-3');

      // Web Audio API Alarme Sonoro Contínuo
      let audioCtx = null;
      function playAlarmBeep() {
        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          if (!audioCtx) audioCtx = new AudioContextClass();
          if (audioCtx.state === 'suspended') audioCtx.resume();

          const now = audioCtx.currentTime;
          [0, 0.22, 0.44].forEach((offset, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(idx === 2 ? 1046.5 : 880, now + offset);
            gain.gain.setValueAtTime(0.001, now + offset);
            gain.gain.exponentialRampToValueAtTime(0.28, now + offset + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.17);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + offset);
            osc.stop(now + offset + 0.18);
          });
        } catch (e) {
          // Ignora bloqueio de áudio automático se ocorrer
        }
      }

      function startAlarmLoop() {
        stopAlarmLoop();
        ui.timer.alarming = true;
        playAlarmBeep();
        ui.timer.alarmIntervalId = setInterval(() => {
          playAlarmBeep();

      }

      function stopAlarmLoop() {
        ui.timer.alarming = false;
        if (ui.timer.alarmIntervalId) {
          clearInterval(ui.timer.alarmIntervalId);
          ui.timer.alarmIntervalId = null;

      function formatClock(sec) {
        const s = Math.max(0, Math.floor(sec));
        const mins = Math.floor(s / 60);
        const secs = s % 60;
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }

      function getTimerPhase() {
        if (ui.timer.alarming) {
          return {
            text: 'text-rose-500',
            bar: 'bg-rose-500',
            border: 'border-rose-500',
            iconBg: 'bg-rose-500/15 text-rose-500'
          };
        }
        const ratio = ui.timer.totalSeconds > 0 ? ui.timer.secondsLeft / ui.timer.totalSeconds : 1;
        if (ratio <= 0.15) {
          return {
            text: 'text-rose-500',
            bar: 'bg-rose-500',
            border: 'border-rose-500/70',
            iconBg: 'bg-rose-500/15 text-rose-500'
          };
        }
        if (ratio <= 0.5) {
          return {
            text: 'text-amber-500',
            bar: 'bg-amber-500',
            border: 'border-amber-500/70',
            iconBg: 'bg-amber-500/15 text-amber-500'
          };

        return {
          text: 'text-cyan-500',
          bar: 'bg-cyan-500',
          border: 'border-cyan-500/50',
          iconBg: 'bg-cyan-500/15 text-cyan-500'

        const phase = getTimerPhase();
        const pct = ui.timer.totalSeconds > 0

        card.className = `cronometro-sticky rounded-2xl border-2 ${phase.border} p-4 transition-colors`;
        clock.textContent = formatClock(ui.timer.secondsLeft);
        clock.className = `font-display font-extrabold text-3xl sm:text-4xl tracking-tight leading-none ${phase.text}`;

        if (iconBox) {
          iconBox.className = `w-11 h-11 rounded-xl flex items-center justify-center shrink-0 ${phase.iconBg}`;
        }

        bar.style.width = `${pct}%`;
        bar.className = `h-full rounded-full transition-all duration-300 ${phase.bar}`;

        if (ui.timer.alarming) {
          actions.innerHTML = `

      // ======================== 4. ABA DIETA ========================
      function renderDietTab(prof) {
        const totals = prof.meals.reduce((acc, m) => {
          if (m.done) {
            acc.kcal += m.kcal;
            acc.p += m.p;
            acc.c += m.c;
            acc.g += m.g;
          }
          acc.plannedKcal += m.kcal;
          return acc;
        }, { kcal: 0, p: 0, c: 0, g: 0, plannedKcal: 0 });

        const goalP = Math.round((prof.calorieGoal * 0.28) / 4);
        const goalC = Math.round((prof.calorieGoal * 0.47) / 4);
        const goalG = Math.round((prof.calorieGoal * 0.25) / 9);

        const macroBar = (label, val, max, color) => {
          const pct = Math.min(100, Math.round((val / Math.max(1, max)) * 100));
          return `
            <div class="space-y-1">
              <div class="flex justify-between text-xs font-bold">
                <span>${label}</span>
                <span class="text-slate-500 dark:text-slate-400">${val}g / ${max}g</span>
              </div>
              <div class="w-full h-2 rounded-full bg-slate-200 dark:bg-[#0d1117] overflow-hidden">
                <div class="h-full rounded-full ${color}" style="width: ${pct}%"></div>
              </div>
            </div>
          `;
        };

        return `
          <div class="flex items-center justify-between gap-2">
            <div>
              <h1 class="font-display font-extrabold text-xl sm:text-2xl">Plano Alimentar</h1>
              <p class="text-xs font-bold text-blue-600 dark:text-blue-400">Meta: ${prof.calorieGoal.toLocaleString('pt-BR')} kcal/dia</p>
            </div>
            <button onclick="MF.openMealModal()"

          <!-- Resumo de Calorias e Macros -->

            <div class="flex items-baseline justify-between">
              <div>
                <span class="text-xs text-slate-500 dark:text-slate-400">Ingerido hoje</span>
                <div class="font-display font-extrabold text-2xl sm:text-3xl text-emerald-600 dark:text-emerald-400">
                  ${totals.kcal.toLocaleString('pt-BR')} <span class="text-sm font-semibold text-slate-500">/ ${prof.calorieGoal.toLocaleString('pt-BR')} kcal</span>
                </div>
              </div>
              <span class="text-xs font-bold px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-[#1f242c]">
                Cardápio: ${totals.plannedKcal.toLocaleString('pt-BR')} kcal
              </span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
              ${macroBar('Proteínas', totals.p, goalP, 'bg-cyan-500')}
              ${macroBar('Carboidratos', totals.c, goalC, 'bg-emerald-500')}
              ${macroBar('Gorduras', totals.g, goalG, 'bg-amber-500')}
            </div>
          </section>

          <!-- Lista de Refeições -->
          <section class="space-y-3">
            ${prof.meals.map(meal => `
              <div class="card-box rounded-2xl p-4 flex items-start justify-between gap-3 ${meal.done ? 'border-emerald-500/40' : ''}">
                <div class="flex items-start gap-3">
                  <button onclick="MF.toggleMealDone('${meal.id}')" aria-label="Marcar refeição concluída"
                    class="mt-0.5 w-7 h-7 rounded-xl border flex items-center justify-center shrink-0 transition ${meal.done
                      ? 'bg-emerald-500 border-emerald-400 text-slate-950 font-extrabold'
                      : 'bg-slate-50 dark:bg-[#0d1117] border-slate-300 dark:border-[#30363d] text-transparent'}">
                    ✓
                  </button>
                  <div>
                    <div class="flex items-center gap-2">
                      <span class="text-xs font-extrabold text-cyan-600 dark:text-cyan-400">${meal.time}</span>
                      <h3 class="font-display font-bold text-base ${meal.done ? 'line-through opacity-70' : ''}">${meal.name}</h3>
                    </div>
                    <p class="text-xs text-slate-600 dark:text-slate-300 mt-1">${meal.desc}</p>
                    <div class="flex flex-wrap gap-2 mt-2 text-[11px] font-bold text-slate-500 dark:text-slate-400">
                      <span class="px-2 py-0.5 rounded bg-slate-100 dark:bg-[#0d1117]">${meal.kcal} kcal</span>
                      <span>P: ${meal.p}g</span>
                      <span>C: ${meal.c}g</span>
                      <span>G: ${meal.g}g</span>

                <div class="flex items-center gap-1 shrink-0">

      // Renderização Principal
      function renderApp() {
        applyTheme();
        renderHeaderProfiles();
        renderBottomNav();

        const prof = activeProfile();
        const container = document.getElementById('app-content');
        if (!container) return;

        if (ui.activeTab === 'workouts') {
          container.innerHTML = renderWorkoutsTab(prof);
          syncTimerDOM();
        } else if (ui.activeTab === 'home') {
          container.innerHTML = renderHomeTab(prof);
        } else if (ui.activeTab === 'evolution') {
          container.innerHTML = renderEvolutionTab(prof);
        } else if (ui.activeTab === 'diet') {
          container.innerHTML = renderDietTab(prof);
        } else if (ui.activeTab === 'squad') {
          container.innerHTML = renderSquadTab();
        }
      }

      // Controle de Modais
      function openModal(html) {
        const backdrop = document.getElementById('modal-backdrop');
        const panel = document.getElementById('modal-panel');
        if (!backdrop || !panel) return;
        panel.innerHTML = html;
        backdrop.classList.remove('hidden');
        backdrop.classList.add('flex');
      }

      function closeModal() {
        const backdrop = document.getElementById('modal-backdrop');
        if (!backdrop) return;
        backdrop.classList.add('hidden');
        backdrop.classList.remove('flex');
      }

      document.getElementById('modal-backdrop').addEventListener('click', (e) => {
        if (e.target.id === 'modal-backdrop') closeModal();
      });

      // API Pública Global (window.MF)
      window.MF = {
        setTab(tab) {
          ui.activeTab = tab;
          renderApp();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        },

        toggleTheme() {
          state.theme = state.theme === 'dark' ? 'light' : 'dark';
          saveState();
          applyTheme();
          showToast(state.theme === 'dark' ? 'Modo Escuro Confortável ativado' : 'Modo Claro Clean ativado');
        },

        switchProfile(id) {
          if (!state.profiles[id]) return;
          state.activeProfileId = id;
          ui.bfSexView = null;
          saveState();
          renderApp();
          showToast(`Perfil ativo: ${state.profiles[id].name}`);
        },

        // Cronômetro
        setTimerPreset(seconds) {
          stopAlarmLoop();
          clearInterval(ui.timer.intervalId);
          ui.timer.running = false;
          ui.timer.totalSeconds = seconds;
          ui.timer.secondsLeft = seconds;
          renderApp();
        },

        applyCustomTimer() {
          const m = parseInt(document.getElementById('custom-timer-min')?.value || '0', 10) || 0;
          const s = parseInt(document.getElementById('custom-timer-sec')?.value || '0', 10) || 0;
          const total = Math.max(5, Math.min(3599, m * 60 + s));
          this.setTimerPreset(total);
          showToast(`Tempo definido para ${formatClock(total)}`);
        },

        toggleTimer() {
          if (ui.timer.alarming) {
            this.stopAlarmAndReset();
            return;
          }
          if (ui.timer.running) {
            clearInterval(ui.timer.intervalId);
            ui.timer.running = false;
            syncTimerDOM();
            return;
          }
          if (ui.timer.secondsLeft <= 0) {
            ui.timer.secondsLeft = ui.timer.totalSeconds;
          }
          ui.timer.running = true;
          syncTimerDOM();

          ui.timer.intervalId = setInterval(() => {
            ui.timer.secondsLeft -= 1;
            if (ui.timer.secondsLeft <= 0) {
              ui.timer.secondsLeft = 0;
              ui.timer.running = false;
              clearInterval(ui.timer.intervalId);
              startAlarmLoop();
            }
            syncTimerDOM();
          }, 1000);
        },

        resetTimer() {
          stopAlarmLoop();
          clearInterval(ui.timer.intervalId);
          ui.timer.running = false;
          ui.timer.secondsLeft = ui.timer.totalSeconds;
          syncTimerDOM();
        },

        stopAlarmAndReset() {
          this.resetTimer();
          showToast('Alarme desligado');
        },

        startRestFromExercise() {
          stopAlarmLoop();
          clearInterval(ui.timer.intervalId);
          ui.timer.secondsLeft = ui.timer.totalSeconds;
          ui.timer.running = true;
          syncTimerDOM();
          ui.timer.intervalId = setInterval(() => {
            ui.timer.secondsLeft -= 1;
            if (ui.timer.secondsLeft <= 0) {
              ui.timer.secondsLeft = 0;
              ui.timer.running = false;
              clearInterval(ui.timer.intervalId);
              startAlarmLoop();
            }
            syncTimerDOM();
          }, 1000);
          showToast(`Descanso iniciado (${formatClock(ui.timer.totalSeconds)})`);
        },

        // Treinos
        selectWorkoutDay(dayKey) {
          ui.selectedDay = dayKey;
          renderApp();
        },

        openDayWorkout(dayKey) {
          ui.selectedDay = dayKey;
          ui.activeTab = 'workouts';
          renderApp();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        },

        updateSetLog(exId, setIdx, field, value) {
          const prof = activeProfile();
          const dayPlan = prof.schedule[ui.selectedDay];
          const ex = dayPlan?.exercises.find(e => e.id === exId);
          if (!ex || !ex.logs[setIdx]) return;
          ex.logs[setIdx][field] = value;
          if (field === 'kg' && parseFloat(value) > 0) {
            ex.currBest = `${value} kg`;
          }
          saveState();
        },

        toggleSetDone(exId, setIdx) {
          const prof = activeProfile();
          const dayPlan = prof.schedule[ui.selectedDay];
          const ex = dayPlan?.exercises.find(e => e.id === exId);
          if (!ex || !ex.logs[setIdx]) return;
          ex.logs[setIdx].done = !ex.logs[setIdx].done;
          saveState();
          renderApp();
        },

        removeExercise(exId) {
          const prof = activeProfile();
          const dayPlan = prof.schedule[ui.selectedDay];
          if (!dayPlan) return;
          dayPlan.exercises = dayPlan.exercises.filter(e => e.id !== exId);
          saveState();
          renderApp();
          showToast('Exercício removido');
        },

        openAddExerciseModal() {
          openModal(`
            <div class="flex items-center justify-between">
              <h3 class="font-display font-extrabold text-lg">Novo Exercício</h3>
              <button onclick="MF.closeModal()" class="text-slate-400 hover:text-rose-500 font-bold">✕</button>
            </div>
            <div class="space-y-3">
              <div>
                <label class="text-xs font-bold text-slate-500">Nome do exercício</label>
                <input id="new-ex-name" type="text" placeholder="Ex: Rosca direta halteres"
                  class="mt-1 w-full rounded-xl bg-slate-100 dark:bg-[#0d1117] border border-slate-300 dark:border-[#30363d] px-3 py-2.5 text-sm font-semibold" />
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="text-xs font-bold text-slate-500">Séries</label>
                  <input id="new-ex-sets" type="number" min="1" max="10" value="3"
                    class="mt-1 w-full rounded-xl bg-slate-100 dark:bg-[#0d1117] border border-slate-300 dark:border-[#30363d] px-3 py-2.5 text-sm font-semibold" />
                </div>
                <div>
                  <label class="text-xs font-bold text-slate-500">Faixa de reps</label>
                  <input id="new-ex-reps" type="text" value="10-12"
                    class="mt-1 w-full rounded-xl bg-slate-100 dark:bg-[#0d1117] border border-slate-300 dark:border-[#30363d] px-3 py-2.5 text-sm font-semibold" />
                </div>
              </div>
              <button onclick="MF.saveNewExercise()"
                class="w-full py-3 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-display font-extrabold text-sm">
                Adicionar ao Treino
              </button>
            </div>
          `);
        },

        saveNewExercise() {
          const name = (document.getElementById('new-ex-name')?.value || '').trim();
          const sets = Math.max(1, Math.min(10, parseInt(document.getElementById('new-ex-sets')?.value || '3', 10) || 3));
          const reps = (document.getElementById('new-ex-reps')?.value || '10-12').trim();
          if (!name) {
            showToast('Digite o nome do exercício');
            return;
          }
          const prof = activeProfile();
          const dayPlan = prof.schedule[ui.selectedDay];
          const logs = Array.from({ length: sets }, () => ({ kg: '15', reps: '12', done: false }));
          dayPlan.exercises.push({
            id: 'ex_' + Date.now(),
            name,
            sets,
            reps,
            logs
          });
          saveState();
          closeModal();
          renderApp();
          showToast('Exercício adicionado!');
        },

        // Perfis
        openCreateProfileModal() {
          openModal(`
            <div class="flex items-center justify-between">
              <h3 class="font-display font-extrabold text-lg">Criar Novo Perfil</h3>
              <button onclick="MF.closeModal()" class="text-slate-400 hover:text-rose-500 font-bold">✕</button>
            </div>
            <div class="space-y-3">
              <div>
                <label class="text-xs font-bold text-slate-500">Nome</label>
                <input id="cp-name" type="text" placeholder="Ex: Rafael"
                  class="mt-1 w-full rounded-xl bg-slate-100 dark:bg-[#0d1117] border border-slate-300 dark:border-[#30363d] px-3 py-2.5 text-sm font-semibold" />
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="text-xs font-bold text-slate-500">Sexo</label>
                  <select id="cp-sex" class="mt-1 w-full rounded-xl bg-slate-100 dark:bg-[#0d1117] border border-slate-300 dark:border-[#30363d] px-3 py-2.5 text-sm font-semibold">
                    <option value="F">Feminino</option>
                    <option value="M">Masculino</option>
                  </select>
                </div>
                <div>
                  <label class="text-xs font-bold text-slate-500">Peso atual (kg)</label>
                  <input id="cp-weight" type="number" step="0.1" value="70.0"
                    class="mt-1 w-full rounded-xl bg-slate-100 dark:bg-[#0d1117] border border-slate-300 dark:border-[#30363d] px-3 py-2.5 text-sm font-semibold" />
                </div>
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="text-xs font-bold text-slate-500">Meta de peso (kg)</label>
                  <input id="cp-goal" type="number" step="0.1" value="68.0"
                    class="mt-1 w-full rounded-xl bg-slate-100 dark:bg-[#0d1117] border border-slate-300 dark:border-[#30363d] px-3 py-2.5 text-sm font-semibold" />
                </div>
                <div>
                  <label class="text-xs font-bold text-slate-500">Meta kcal/dia</label>
                  <input id="cp-kcal" type="number" value="2400"
                    class="mt-1 w-full rounded-xl bg-slate-100 dark:bg-[#0d1117] border border-slate-300 dark:border-[#30363d] px-3 py-2.5 text-sm font-semibold" />
                </div>
              </div>
              <button onclick="MF.saveNewProfile()"
                class="w-full py-3 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-display font-extrabold text-sm">
                Criar Perfil
              </button>
            </div>
          `);
        },

        saveNewProfile() {
          const name = (document.getElementById('cp-name')?.value || '').trim();
          if (!name) {
            showToast('Informe o nome do perfil');
            return;
          }
          const sex = document.getElementById('cp-sex')?.value || 'F';
          const weight = parseFloat(document.getElementById('cp-weight')?.value || '70') || 70;
          const goalWeight = parseFloat(document.getElementById('cp-goal')?.value || '68') || 68;
          const calorieGoal = parseInt(document.getElementById('cp-kcal')?.value || '2400', 10) || 2400;

          const id = 'user_' + Date.now();
          const template = JSON.parse(JSON.stringify(activeProfile()));
          template.id = id;
          template.name = name;
          template.sex = sex;
          template.weight = weight;
          template.goalWeight = goalWeight;
          template.calorieGoal = calorieGoal;
          template.weeklyDelta = 'Início da jornada';
          template.bodyFat = sex === 'F' ? 23.0 : 17.0;
          template.weightHistory = [{ date: 'Hoje', weight, bf: template.bodyFat }];

          state.profiles[id] = template;
          state.activeProfileId = id;
          saveState();
          closeModal();
          renderApp();
          showToast(`Bem-vindo(a), ${name}!`);
        },

        openEditProfileModal() {
          const prof = activeProfile();
          openModal(`
            <div class="flex items-center justify-between">
              <h3 class="font-display font-extrabold text-lg">Editar Perfil (${prof.name})</h3>
              <button onclick="MF.closeModal()" class="text-slate-400 hover:text-rose-500 font-bold">✕</button>
            </div>
            <div class="space-y-3">
              <div>
                <label class="text-xs font-bold text-slate-500">Nome</label>
                <input id="ep-name" type="text" value="${prof.name}"
                  class="mt-1 w-full rounded-xl bg-slate-100 dark:bg-[#0d1117] border border-slate-300 dark:border-[#30363d] px-3 py-2.5 text-sm font-semibold" />
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="text-xs font-bold text-slate-500">Peso atual (kg)</label>
                  <input id="ep-weight" type="number" step="0.1" value="${prof.weight}"
                    class="mt-1 w-full rounded-xl bg-slate-100 dark:bg-[#0d1117] border border-slate-300 dark:border-[#30363d] px-3 py-2.5 text-sm font-semibold" />
                </div>
                <div>
                  <label class="text-xs font-bold text-slate-500">Meta de peso (kg)</label>
                  <input id="ep-goal" type="number" step="0.1" value="${prof.goalWeight}"
                    class="mt-1 w-full rounded-xl bg-slate-100 dark:bg-[#0d1117] border border-slate-300 dark:border-[#30363d] px-3 py-2.5 text-sm font-semibold" />
                </div>
              </div>
              <div>
                <label class="text-xs font-bold text-slate-500">Meta diária de calorias (kcal/dia)</label>
                <input id="ep-kcal" type="number" value="${prof.calorieGoal}"
                  class="mt-1 w-full rounded-xl bg-slate-100 dark:bg-[#0d1117] border border-slate-300 dark:border-[#30363d] px-3 py-2.5 text-sm font-semibold" />
              </div>
              <button onclick="MF.saveEditedProfile()"
                class="w-full py-3 rounded-xl bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-display font-extrabold text-sm">
                Salvar Alterações
              </button>
            </div>
          `);
        },

        saveEditedProfile() {
          const prof = activeProfile();
          prof.name = (document.getElementById('ep-name')?.value || prof.name).trim();
          prof.weight = parseFloat(document.getElementById('ep-weight')?.value || prof.weight) || prof.weight;
          prof.goalWeight = parseFloat(document.getElementById('ep-goal')?.value || prof.goalWeight) || prof.goalWeight;
          prof.calorieGoal = parseInt(document.getElementById('ep-kcal')?.value || prof.calorieGoal, 10) || prof.calorieGoal;
          saveState();
          closeModal();
          renderApp();
          showToast('Perfil atualizado!');
        },

        // Evolução
        setBfSexView(sex) {
          ui.bfSexView = sex;
          renderApp();
        },

        openWeightModal() {
          const prof = activeProfile();
          openModal(`
            <div class="flex items-center justify-between">
              <h3 class="font-display font-extrabold text-lg">Registrar Peso & %BF</h3>
              <button onclick="MF.closeModal()" class="text-slate-400 hover:text-rose-500 font-bold">✕</button>
            </div>
            <div class="space-y-3">
              <div>
                <label class="text-xs font-bold text-slate-500">Peso atual (kg)</label>
                <input id="reg-weight" type="number" step="0.1" value="${prof.weight}"
                  class="mt-1 w-full rounded-xl bg-slate-100 dark:bg-[#0d1117] border border-slate-300 dark:border-[#30363d] px-3 py-2.5 text-sm font-semibold" />
              </div>
              <div>
                <label class="text-xs font-bold text-slate-500">Gordura corporal (%BF)</label>
                <input id="reg-bf" type="number" step="0.1" value="${prof.bodyFat}"
                  class="mt-1 w-full rounded-xl bg-slate-100 dark:bg-[#0d1117] border border-slate-300 dark:border-[#30363d] px-3 py-2.5 text-sm font-semibold" />
              </div>
              <button onclick="MF.saveWeightEntry()"
                class="w-full py-3 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-display font-extrabold text-sm">
                Salvar Medição
              </button>
            </div>
          `);
        },

        saveWeightEntry() {
          const prof = activeProfile();
          const newW = parseFloat(document.getElementById('reg-weight')?.value || prof.weight) || prof.weight;
          const newBf = parseFloat(document.getElementById('reg-bf')?.value || prof.bodyFat) || prof.bodyFat;
          const diff = newW - prof.weight;
          prof.weeklyDelta = `${diff <= 0 ? '' : '+'}${diff.toFixed(1).replace('.', ',')} kg na última medição`;
          prof.weight = newW;
          prof.bodyFat = newBf;

          const now = new Date();
          const dateLabel = `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}`;
          prof.weightHistory.push({ date: dateLabel, weight: newW, bf: newBf });
          saveState();
          closeModal();
          renderApp();
          showToast('Medição registrada com sucesso!');
        },

        // Dieta
        toggleMealDone(mealId) {
          const prof = activeProfile();
          const meal = prof.meals.find(m => m.id === mealId);
          if (!meal) return;
          meal.done = !meal.done;
          saveState();
          renderApp();
        },

        deleteMeal(mealId) {
          const prof = activeProfile();
          prof.meals = prof.meals.filter(m => m.id !== mealId);
          saveState();
          renderApp();
          showToast('Refeição removida');
        },

        openMealModal(editId) {
          const prof = activeProfile();
          const existing = editId ? prof.meals.find(m => m.id === editId) : null;
          openModal(`
            <div class="flex items-center justify-between">
              <h3 class="font-display font-extrabold text-lg">${existing ? 'Editar Refeição' : 'Nova Refeição'}</h3>
              <button onclick="MF.closeModal()" class="text-slate-400 hover:text-rose-500 font-bold">✕</button>
            </div>
            <div class="space-y-3">
              <div class="grid grid-cols-3 gap-2">
                <div>
                  <label class="text-xs font-bold text-slate-500">Horário</label>
                  <input id="ml-time" type="text" value="${existing ? existing.time : '15:00'}"
                    class="mt-1 w-full rounded-xl bg-slate-100 dark:bg-[#0d1117] border border-slate-300 dark:border-[#30363d] px-3 py-2 text-sm font-semibold" />
                </div>
                <div class="col-span-2">
                  <label class="text-xs font-bold text-slate-500">Nome</label>
                  <input id="ml-name" type="text" value="${existing ? existing.name : 'Lanche da Tarde'}"
                    class="mt-1 w-full rounded-xl bg-slate-100 dark:bg-[#0d1117] border border-slate-300 dark:border-[#30363d] px-3 py-2 text-sm font-semibold" />
                </div>
              </div>
              <div>
                <label class="text-xs font-bold text-slate-500">Alimentos</label>
                <input id="ml-desc" type="text" value="${existing ? existing.desc : 'Sanduíche natural de frango e suco'}"
                  class="mt-1 w-full rounded-xl bg-slate-100 dark:bg-[#0d1117] border border-slate-300 dark:border-[#30363d] px-3 py-2 text-sm font-semibold" />
              </div>
              <div class="grid grid-cols-4 gap-2">
                <div>
                  <label class="text-[11px] font-bold text-slate-500">Kcal</label>
                  <input id="ml-kcal" type="number" value="${existing ? existing.kcal : 420}"
                    class="mt-1 w-full rounded-xl bg-slate-100 dark:bg-[#0d1117] border border-slate-300 dark:border-[#30363d] px-2 py-2 text-sm font-semibold" />
                </div>
                <div>
                  <label class="text-[11px] font-bold text-slate-500">Prot (g)</label>
                  <input id="ml-p" type="number" value="${existing ? existing.p : 28}"
                    class="mt-1 w-full rounded-xl bg-slate-100 dark:bg-[#0d1117] border border-slate-300 dark:border-[#30363d] px-2 py-2 text-sm font-semibold" />
                </div>
                <div>
                  <label class="text-[11px] font-bold text-slate-500">Carb (g)</label>
                  <input id="ml-c" type="number" value="${existing ? existing.c : 48}"
                    class="mt-1 w-full rounded-xl bg-slate-100 dark:bg-[#0d1117] border border-slate-300 dark:border-[#30363d] px-2 py-2 text-sm font-semibold" />
                </div>
                <div>
                  <label class="text-[11px] font-bold text-slate-500">Gord (g)</label>
                  <input id="ml-g" type="number" value="${existing ? existing.g : 11}"
                    class="mt-1 w-full rounded-xl bg-slate-100 dark:bg-[#0d1117] border border-slate-300 dark:border-[#30363d] px-2 py-2 text-sm font-semibold" />
                </div>
              </div>
              <button onclick="MF.saveMeal('${existing ? existing.id : ''}')"
                class="w-full py-3 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-display font-extrabold text-sm">
                Salvar Refeição
              </button>
            </div>
          `);
        },

        saveMeal(editId) {
          const prof = activeProfile();
          const data = {
            id: editId || 'meal_' + Date.now(),
            time: (document.getElementById('ml-time')?.value || '12:00').trim(),
            name: (document.getElementById('ml-name')?.value || 'Refeição').trim(),
            desc: (document.getElementById('ml-desc')?.value || '').trim(),
            kcal: parseInt(document.getElementById('ml-kcal')?.value || '0', 10) || 0,
            p: parseInt(document.getElementById('ml-p')?.value || '0', 10) || 0,
            c: parseInt(document.getElementById('ml-c')?.value || '0', 10) || 0,
            g: parseInt(document.getElementById('ml-g')?.value || '0', 10) || 0,
            done: false
          };

          if (editId) {
            const idx = prof.meals.findIndex(m => m.id === editId);
            if (idx >= 0) {
              data.done = prof.meals[idx].done;
              prof.meals[idx] = data;
            }
          } else {
            prof.meals.push(data);
          }
          saveState();
          closeModal();
          renderApp();
          showToast('Refeição salva!');
        },

        // Galera & JSON
        copyClubLink() {
          const input = document.getElementById('club-share-url');
          if (input) {
            input.select();
            input.setSelectionRange(0, 99999);
            try {
              document.execCommand('copy');
              showToast('Link copiado! Pronto para colar no WhatsApp.');
            } catch (e) {
              showToast('Link: https://manufitclube.github.io/');
            }
          }
        },

        exportJSON() {
          const jsonStr = JSON.stringify(state, null, 2);
          openModal(`
            <div class="flex items-center justify-between">
              <h3 class="font-display font-extrabold text-lg">Dados do Clube (JSON)</h3>
              <button onclick="MF.closeModal()" class="text-slate-400 hover:text-rose-500 font-bold">✕</button>
            </div>
            <textarea id="export-json-area" rows="7" readonly
              class="w-full rounded-xl bg-slate-100 dark:bg-[#0d1117] border border-slate-300 dark:border-[#30363d] p-3 text-xs font-mono">${jsonStr}</textarea>
            <button onclick="MF.copyJSONText()"
              class="w-full py-3 rounded-xl bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-display font-extrabold text-sm">
              Copiar Código JSON
            </button>
          `);
        },

        copyJSONText() {
          const area = document.getElementById('export-json-area');
          if (!area) return;
          area.select();
          document.execCommand('copy');
          closeModal();
          showToast('JSON copiado para a área de transferência!');
        },

        openImportJSONModal() {
          openModal(`
            <div class="flex items-center justify-between">
              <h3 class="font-display font-extrabold text-lg">Importar Dados (JSON)</h3>
              <button onclick="MF.closeModal()" class="text-slate-400 hover:text-rose-500 font-bold">✕</button>
            </div>
            <textarea id="import-json-area" rows="7" placeholder="Cole aqui o JSON exportado..."
              class="w-full rounded-xl bg-slate-100 dark:bg-[#0d1117] border border-slate-300 dark:border-[#30363d] p-3 text-xs font-mono"></textarea>
            <button onclick="MF.confirmImportJSON()"
              class="w-full py-3 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-display font-extrabold text-sm">
              Importar e Atualizar
            </button>
          `);
        },

        confirmImportJSON() {
          try {
            const raw = document.getElementById('import-json-area')?.value || '';
            const parsed = JSON.parse(raw);
            if (!parsed || !parsed.profiles) throw new Error('Formato inválido');
            state = parsed;
            saveState();
            closeModal();
            renderApp();
            showToast('Dados importados com sucesso!');
          } catch (e) {
            showToast('JSON inválido. Verifique o texto colado.');
          }
        },

        closeModal
      };

      // Inicializa imediatamente
      renderApp();
    })();
  </script>
</body>
</html>
