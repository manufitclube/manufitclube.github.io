    function renderProteinCalculator(p) {
      const ranked = [...(p.proteinFoods || [])].map(item => {
        const totalProt = (Number(item.packWeight) / 100) * Number(item.protPer100);
        const cost25 = totalProt > 0 ? (Number(item.price) / totalProt) * 25 : 0;
        return { ...item, cost25 };
      }).sort((a, b) => a.cost25 - b.cost25);

      return `
        <div class="card-surface rounded-2xl p-5 space-y-4">
          <div>
            <h3 class="font-display text-lg font-bold flex items-center gap-2">
              <i data-lucide="calculator" class="w-5 h-5 text-emerald-500"></i> Custo por 25g de Proteína
            </h3>
            <p class="text-xs text-slate-500 dark:text-slate-400">Descubra qual fonte de proteína rende mais no seu mercado.</p>
          </div>
          <form onsubmit="MF.addProteinFood(event)" class="grid grid-cols-2 sm:grid-cols-12 gap-2.5 items-end">
            <div class="col-span-2 sm:col-span-4">
              <label class="block text-[10px] text-slate-500 mb-1">Alimento</label>
              <input type="text" id="pf-name" placeholder="Ex: Sardinha, Patinho..." required class="w-full surface-subtle rounded-xl px-3 py-2 text-xs" />
            </div>
            <div class="sm:col-span-2">
              <label class="block text-[10px] text-slate-500 mb-1">Preço (R$)</label>
              <input type="number" step="0.01" id="pf-price" placeholder="21.90" required class="w-full surface-subtle rounded-xl px-3 py-2 text-xs" />
            </div>
            <div class="sm:col-span-2">
              <label class="block text-[10px] text-slate-500 mb-1">Peso (g)</label>
              <input type="number" id="pf-weight" placeholder="1000" required class="w-full surface-subtle rounded-xl px-3 py-2 text-xs" />
            </div>
            <div class="sm:col-span-2">
              <label class="block text-[10px] text-slate-500 mb-1">Prot / 100g</label>
              <input type="number" step="0.1" id="pf-prot" placeholder="23" required class="w-full surface-subtle rounded-xl px-3 py-2 text-xs" />
            </div>
            <div class="col-span-2 sm:col-span-2">
              <button type="submit" class="w-full py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs">Comparar</button>
            </div>
          </form>

          <div class="space-y-2 pt-2">
            ${ranked.map((item, idx) => `
              <div class="flex items-center justify-between gap-2 p-3.5 rounded-xl border ${idx === 0 ? 'bg-emerald-500/10 border-emerald-500/40' : 'surface-subtle'}">
                <div class="flex items-center gap-3">
                  <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${idx === 0 ? 'bg-emerald-500 text-white' : 'bg-slate-200 dark:bg-slate-800 text-slate-500'}">${idx + 1}º</span>
                  <div>
                    <p class="text-sm font-bold">${escapeHtml(item.name)}</p>
                    <p class="text-[11px] text-slate-500 dark:text-slate-400">R$ ${Number(item.price).toFixed(2).replace('.', ',')} / ${item.packWeight}g • ${item.protPer100}g prot/100g</p>
                  </div>
                </div>
                <div class="flex items-center gap-3">
                  <span class="font-display text-base font-extrabold ${idx === 0 ? 'text-emerald-500' : ''}">R$ ${item.cost25.toFixed(2).replace('.', ',')}</span>
                  <button onclick="MF.removeProteinFood('${item.id}')" class="text-slate-400 hover:text-rose-500"><i data-lucide="x" class="w-4 h-4"></i></button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

              renderApp();

      const existing = exId ? (day.exercises || []).find(e => e.id === exId) : null;
      const ex = existing || { name: '', sets: 3, reps: '8-12' };

      openModal({
        title: existing ? 'Editar Exercício' : 'Adicionar Exercício',
        bodyHtml: `
          <div class="space-y-3">
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">Nome do exercício</label>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Séries</label>
                <input id="ex-sets" type="number" min="1" max="10" value="${ex.sets}" class="w-full surface-subtle rounded-xl px-3 py-2 text-sm" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Faixa de reps</label>

              </div>
            </div>
          </div>
        `,
        actions: [
          { label: 'Cancelar', className: 'px-4 py-2 rounded-xl text-xs font-semibold surface-subtle' },
          {
            label: 'Salvar',
            className: 'px-4 py-2 rounded-xl text-xs font-bold bg-cyan-600 text-white hover:bg-cyan-500',
            onClick: () => {
              const name = document.getElementById('ex-name').value.trim();
              if (!name) return false;
              const obj = {
                id: existing ? existing.id : 'ex_' + Date.now(),

              renderApp();

    function openMealModal(mealId = null) {
      const p = getActiveProfile();
      const existing = mealId ? (p.meals || []).find(m => m.id === mealId) : null;
      const m = existing || { name: '', kcal: 500, protein: 30, items: '' };

      openModal({
        title: existing ? 'Editar Refeição' : 'Nova Refeição',
        bodyHtml: `
          <div class="space-y-3">
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">Nome</label>
              <input id="mm-name" type="text" value="${escapeHtml(m.name)}" placeholder="Ex: Ceia" class="w-full surface-subtle rounded-xl px-3 py-2 text-sm" />
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Calorias (kcal)</label>
                <input id="mm-kcal" type="number" value="${m.kcal}" class="w-full surface-subtle rounded-xl px-3 py-2 text-sm" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Proteína (g)</label>
                <input id="mm-prot" type="number" value="${m.protein}" class="w-full surface-subtle rounded-xl px-3 py-2 text-sm" />
              </div>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">Alimentos</label>
              <textarea id="mm-items" rows="2" class="w-full surface-subtle rounded-xl px-3 py-2 text-sm">${escapeHtml(m.items)}</textarea>
            </div>
          </div>
        `,
        actions: [
          { label: 'Cancelar', className: 'px-4 py-2 rounded-xl text-xs font-semibold surface-subtle' },
          {
            label: 'Salvar',
            className: 'px-4 py-2 rounded-xl text-xs font-bold bg-emerald-500 text-slate-950 hover:bg-emerald-400',
            onClick: () => {
              const name = document.getElementById('mm-name').value.trim();
              if (!name) return false;
              const obj = {
                id: existing ? existing.id : 'ml_' + Date.now(),
                name,
                kcal: Number(document.getElementById('mm-kcal').value) || 0,
                protein: Number(document.getElementById('mm-prot').value) || 0,
                items: document.getElementById('mm-items').value.trim()
              };
              if (!p.meals) p.meals = [];
              if (existing) p.meals[p.meals.findIndex(x => x.id === existing.id)] = obj;
              else p.meals.push(obj);
              saveState();
              renderApp();
            }
          }
        ]
      });
    }

    /* ==========================================================================
       14. API GLOBAL DE INTERAÇÕES (window.MF)
       ========================================================================== */
    window.MF = {
      closeModal,
      openProfileModal,
      openExerciseModal,
      openMealModal,

      toggleTheme() {
        const isDark = document.documentElement.classList.contains('dark');
        applyTheme(isDark ? 'light' : 'dark');
      },

      switchTab(id) {
        ui.activeTab = id;
        renderApp();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      },

      selectProfile(id) {
        state.activeProfileId = id;
        ui.selectedExerciseChartId = null;
        ui.workoutEditMode = false;
        saveState();
        renderApp();
      },

      openWorkoutDay(dk) {
        ui.selectedDay = dk;
        ui.activeTab = 'workouts';
        ui.workoutEditMode = false;
        renderApp();
      },

      selectWorkoutDay(dk) {
        ui.selectedDay = dk;
        renderApp();
      },

      toggleWorkoutEditMode() {
        ui.workoutEditMode = !ui.workoutEditMode;
        renderApp();
      },

      setDayCategorySubtype(dk, category, subtype) {
        const p = getActiveProfile();
        if (!p.schedule[dk]) p.schedule[dk] = { category, subtype, title: '', exercises: [] };
        const day = p.schedule[dk];
        day.category = category;
        day.subtype = subtype;
        if (category === 'rest') {
          day.title = 'Recuperação muscular';
        } else if (category === 'sport') {
          day.title = subtype;
        } else if (category === 'workout') {
          if (!day.title || day.title === 'Recuperação muscular') day.title = 'Treino de ' + subtype;
          if (!Array.isArray(day.exercises) || day.exercises.length === 0) {
            day.exercises = [{ id: `ex_${Date.now()}`, name: 'Supino reto', sets: 3, reps: '8-12' }];
          }
        }
        saveState();
        renderApp();
      },

      updateDayTitle(dk, val) {
        const p = getActiveProfile();
        if (p.schedule[dk]) {
          p.schedule[dk].title = val;
          saveState();
        }
      },

      deleteExercise(dk, exId) {
        const p = getActiveProfile();
        p.schedule[dk].exercises = (p.schedule[dk].exercises || []).filter(e => e.id !== exId);
        saveState();
        renderApp();
      },

      updateDraft(dk, exId, sIdx, field, val) {
        const p = getActiveProfile();
        const draft = getDraftFor(p.id, dk, p.schedule[dk].exercises);
        draft[exId][sIdx][field] = val;
      },

      toggleDraftDone(dk, exId, sIdx) {
        const p = getActiveProfile();
        const draft = getDraftFor(p.id, dk, p.schedule[dk].exercises);
        const nextVal = !draft[exId][sIdx].done;
        draft[exId][sIdx].done = nextVal;
        renderApp();
      },

      saveWorkoutLog(dk) {
        const p = getActiveProfile();
        const day = p.schedule[dk];
        const draft = getDraftFor(p.id, dk, day.exercises);
        const date = document.getElementById('workout-date-input')?.value || getTodayISO();

        const exercises = (day.exercises || []).map(ex => ({
          id: ex.id,
          name: ex.name,
          sets: (draft[ex.id] || []).slice(0, Number(ex.sets || 3)).map(s => ({ ...s }))
        }));

        if (!exercises.some(e => e.sets.some(s => s.done || s.reps || s.load))) {
          showToast('Preencha pelo menos uma série antes de salvar.', 'warning');
          return;
        }

        if (!p.workoutLogs) p.workoutLogs = [];
        p.workoutLogs.push({ id: 'wl_' + Date.now(), date, dayKey: dk, title: day.title, exercises });
        Object.values(draft).forEach(arr => arr.forEach(s => { s.done = false; }));
        saveState();
        showToast('Treino finalizado e salvo! Confira na aba Evolução.', 'success');
        renderApp();
      },

      saveSportLog(e) {
        e.preventDefault();
        const p = getActiveProfile();
        const day = p.schedule[ui.selectedDay];
        if (!p.sportLogs) p.sportLogs = [];
        p.sportLogs.push({
          id: 'sp_' + Date.now(),
          date: document.getElementById('sport-date').value || getTodayISO(),
          sport: day.subtype || day.title || 'Esporte',
          duration: document.getElementById('sport-duration').value.trim(),
          distance: document.getElementById('sport-distance').value.trim(),
          intensity: document.getElementById('sport-intensity').value,
          notes: document.getElementById('sport-notes').value.trim()
        });
        saveState();
        showToast('Sessão de esporte registrada!', 'success');
        renderApp();
      },

      startTimer(sec) {
        if (ui.timer.intervalId) clearInterval(ui.timer.intervalId);
        stopAlarmLoop();
        ui.timer.secondsLeft = sec;
        ui.timer.totalSeconds = sec;
        ui.timer.running = true;
        ui.timer.intervalId = setInterval(tickTimer, 1000);
        const minInput = document.getElementById('timer-custom-min');
        const secInput = document.getElementById('timer-custom-sec');
        if (minInput) minInput.value = Math.floor(sec / 60);
        if (secInput) secInput.value = String(sec % 60).padStart(2, '0');
        updateTimerUI();
      },
      applyCustomTimer() {
        const m = Math.max(0, Math.min(59, parseInt(document.getElementById('timer-custom-min')?.value || '0', 10) || 0));
        const s = Math.max(0, Math.min(59, parseInt(document.getElementById('timer-custom-sec')?.value || '0', 10) || 0));
        const total = m * 60 + s;
        if (total <= 0) {
          showToast('Defina um tempo maior que 0 segundos.', 'warning');
          return;
        }
        this.startTimer(total);
      },
      toggleTimer() {
        if (ui.timer.alarming) {
          this.stopAlarmAndReset();
          return;
        }
        if (ui.timer.running) {
          clearInterval(ui.timer.intervalId);
          ui.timer.running = false;
        } else {
          if (ui.timer.secondsLeft <= 0) ui.timer.secondsLeft = ui.timer.totalSeconds || 90;
          ui.timer.running = true;
          ui.timer.intervalId = setInterval(tickTimer, 1000);
        }
        updateTimerUI();
      },
      resetTimer() {
        if (ui.timer.intervalId) clearInterval(ui.timer.intervalId);
        stopAlarmLoop();
        ui.timer.running = false;
        ui.timer.secondsLeft = ui.timer.totalSeconds || 90;
        updateTimerUI();
      },
      stopAlarmAndReset() {
        if (ui.timer.intervalId) clearInterval(ui.timer.intervalId);
        stopAlarmLoop();
        ui.timer.running = false;
        ui.timer.secondsLeft = ui.timer.totalSeconds || 90;
        updateTimerUI();
      },

      selectChartExercise(id) {
        ui.selectedExerciseChartId = id;
        renderApp();
      },

      addWeight(e) {
        e.preventDefault();
        const p = getActiveProfile();
        const date = document.getElementById('ev-weight-date').value || getTodayISO();
        const weight = Number(document.getElementById('ev-weight-val').value);
        if (!weight) return;
        if (!p.weights) p.weights = [];
        p.weights.push({ id: 'w_' + Date.now(), date, weight: Number(weight.toFixed(2)) });
        saveState();
        showToast(`Peso ${weight.toFixed(1).replace('.', ',')} kg registrado!`, 'success');
        renderApp();
      },

      addMeasurement(e) {
        e.preventDefault();
        const p = getActiveProfile();
        if (!p.measurements) p.measurements = [];
        const hipEl = document.getElementById('meas-hip');
        const manualEl = document.getElementById('meas-manual-bf');
        const armEl = document.getElementById('meas-arm');
        const chestEl = document.getElementById('meas-chest');
        const thighEl = document.getElementById('meas-thigh');

        p.measurements.push({
          id: 'm_' + Date.now(),
          date: document.getElementById('meas-date').value || getTodayISO(),
          waist: Number(document.getElementById('meas-waist').value),
          neck: Number(document.getElementById('meas-neck').value),
          hip: hipEl && hipEl.value ? Number(hipEl.value) : null,
          arm: armEl && armEl.value ? Number(armEl.value) : null,
          chest: chestEl && chestEl.value ? Number(chestEl.value) : null,
          thigh: thighEl && thighEl.value ? Number(thighEl.value) : null,
          manualBf: manualEl && manualEl.value ? Number(manualEl.value) : null
        });
        saveState();
        showToast('Medidas e % de gordura atualizados!', 'success');
        renderApp();
      },

      setDietSubTab(sub) { ui.dietSubTab = sub; renderApp(); },
      changeDietDate(d) { if (d) { ui.selectedDietDate = d; renderApp(); } },

      adjustKcalTarget(delta) {
        const p = getActiveProfile();
        p.kcalTarget = Math.max(1200, Number(p.kcalTarget || 2500) + delta);
        saveState();
        showToast(`Meta: ${p.kcalTarget} kcal/dia`, 'success');
        renderApp();
      },

      toggleMeal(mealId) {
        const p = getActiveProfile();
        if (!p.dietLogs) p.dietLogs = {};
        if (!p.dietLogs[ui.selectedDietDate]) p.dietLogs[ui.selectedDietDate] = { checked: [], extras: [] };
        const arr = p.dietLogs[ui.selectedDietDate].checked;
        const i = arr.indexOf(mealId);
        if (i >= 0) arr.splice(i, 1); else arr.push(mealId);
        saveState();
        renderApp();
      },

      deleteMeal(mealId) {
        const p = getActiveProfile();
        p.meals = (p.meals || []).filter(m => m.id !== mealId);
        saveState();
        renderApp();
      },

      addDietExtra(e) {
        e.preventDefault();
        const p = getActiveProfile();
        if (!p.dietLogs) p.dietLogs = {};
        if (!p.dietLogs[ui.selectedDietDate]) p.dietLogs[ui.selectedDietDate] = { checked: [], extras: [] };
        p.dietLogs[ui.selectedDietDate].extras.push({
          id: 'ex_' + Date.now(),
          name: document.getElementById('diet-extra-name').value.trim(),
          kcal: Number(document.getElementById('diet-extra-kcal').value) || 0,
          protein: Number(document.getElementById('diet-extra-prot').value) || 0
        });
        saveState();
        showToast('Extra adicionado!', 'success');
        renderApp();
      },

      removeDietExtra(id) {
        const p = getActiveProfile();
        const log = p.dietLogs?.[ui.selectedDietDate];
        if (log) {
          log.extras = (log.extras || []).filter(x => x.id !== id);
          saveState();
          renderApp();
        }
      },

      addProteinFood(e) {
        e.preventDefault();
        const p = getActiveProfile();
        if (!p.proteinFoods) p.proteinFoods = [];
        p.proteinFoods.push({
          id: 'pf_' + Date.now(),
          name: document.getElementById('pf-name').value.trim(),
          price: Number(document.getElementById('pf-price').value),
          packWeight: Number(document.getElementById('pf-weight').value),
          protPer100: Number(document.getElementById('pf-prot').value)
        });
        saveState();
        showToast('Alimento adicionado!', 'success');
        renderApp();
      },

      removeProteinFood(id) {
        const p = getActiveProfile();
        p.proteinFoods = (p.proteinFoods || []).filter(x => x.id !== id);
        saveState();
        renderApp();
      },

      exportBackup() {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `manufit-clube-backup-${getTodayISO()}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast('Backup JSON baixado!', 'success');
      },

      handleImportFile(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const parsed = JSON.parse(e.target.result);
            if (!Array.isArray(parsed.profiles)) throw new Error();
            state = parsed;
            saveState();
            showToast('Backup importado com sucesso!', 'success');
            renderApp();
          } catch {
            showToast('Arquivo JSON inválido.', 'error');
          }
        };
        reader.readAsText(file);
        event.target.value = '';
      }
    };

    /* ==========================================================================
       15. INICIALIZAÇÃO
       ========================================================================== */
    window.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem(THEME_KEY) || 'dark';
      applyTheme(savedTheme);
      renderApp();
    });
  </script>
</body>
</html>
