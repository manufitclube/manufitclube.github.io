      // Gráfico comparativo no modal de análise do diagnóstico
      function buildDiagnosisChartSVG(list) {
        const W = 460;
        const H = 170;
        const padL = 22;
        const padR = 22;
        const padT = 16;
        const padB = 28;
        const plotW = W - padL - padR;
        const plotH = H - padT - padB;

        const norm = (arr) => {
          const min = Math.min(...arr);
          const max = Math.max(...arr);
          const span = Math.max(0.5, max - min);
          return arr.map((v, i) => {
            const x = padL + (arr.length === 1 ? plotW / 2 : (i / (arr.length - 1)) * plotW);
            const ratio = (v - min) / span;
            const y = padT + plotH * 0.85 - ratio * (plotH * 0.7);
            return { x, y };
          });
        };

        const weights = list.map(m => m.weight);
        const wPts = weights.map((v, i) => {
          const x = padL + (list.length === 1 ? plotW / 2 : (i / (list.length - 1)) * plotW);
          const y = padT + plotH * 0.52 - (v - weights[0]) * 6;
          return { x, y: Math.max(padT + 10, Math.min(padT + plotH - 10, y)) };
        });

        const loadPts = norm(list.map(m => m.avgLoadIdx || 100));
        const waistPts = norm(list.map(m => m.waist || 80));
        const toPath = (pts) => pts.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');

        return `
          <svg viewBox="0 0 ${W} ${H}" class="w-full h-auto text-slate-900 dark:text-slate-100">
            <line x1="${padL}" y1="${padT + plotH * 0.5}" x2="${W - padR}" y2="${padT + plotH * 0.5}" stroke="currentColor" stroke-opacity="0.12" stroke-dasharray="3 4" />
            <path d="${toPath(wPts)}" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="5 4" stroke-linecap="round" />
            <path d="${toPath(loadPts)}" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
            <path d="${toPath(waistPts)}" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
            ${list.map((m, i) => {
              const x = padL + (list.length === 1 ? plotW / 2 : (i / (list.length - 1)) * plotW);
              return `
                <circle cx="${loadPts[i].x.toFixed(1)}" cy="${loadPts[i].y.toFixed(1)}" r="3.5" fill="#10b981" />
                <circle cx="${waistPts[i].x.toFixed(1)}" cy="${waistPts[i].y.toFixed(1)}" r="3.5" fill="#06b6d4" />
                <text x="${x.toFixed(1)}" y="${H - 8}" text-anchor="middle" fill="currentColor" fill-opacity="0.6" font-size="10" font-weight="600">${escapeHtml(m.date)}</text>
              `;
            }).join('')}
          </svg>
        `;
      }

      // ======================== CÉREBRO FITNESS REAL DO MANU IA (MASCULINO) ========================
      function generateManuAIResponse(query, prof, draftOverride) {
        const ctx = draftOverride || prof;
        const q = (query || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        const weeklyCount = getWeeklyActiveDaysCount(prof);
        const plan = calculateNutritionPlan({
          sex: ctx.sex, age: ctx.age, height: ctx.height, weight: ctx.weight,
          objective: ctx.objective, weeklyWorkouts: weeklyCount
        });
        const diag = computeDynamicDiagnosis(prof);
        const sportsInWeek = Array.from(new Set(DAYS_ORDER.map(d => prof.schedule[d]?.sport).filter(s => s && s !== 'Descanso')));

        // 1) HIDRATAÇÃO / ÁGUA
        if (/(agua|hidrat|beber|litro|copo|sede|eletr[oó]lito)/.test(q)) {
          const baseL = (plan.waterBaseMl / 1000).toFixed(2).replace('.', ',');
          const trainL = (plan.waterTrainMl / 1000).toFixed(2).replace('.', ',');
          const baseCups = Math.ceil(plan.waterBaseMl / 250);
          const trainCups = Math.ceil(plan.waterTrainMl / 250);
          return {
            text: `💧 **Calculado pra você, ${ctx.name} (${ctx.weight} kg)!**\n\n• **Dia normal (35 ml/kg):** **${baseL} litros** (cerca de ${baseCups} copos de 250 ml).\n• **Dia de treino/esporte intenso (45 ml/kg):** **${trainL} litros** (${trainCups} copos de 250 ml).\n\n**Dica prática do Manu:**\n• Beba **400–500 ml** até 1h antes de treinar.\n• Durante o treino/jogo, dê goles a cada 15–20 min (se passar de 1h suando forte, vale água de coco ou isotônico).\n• Você pode ir marcando cada copo direto no card de **Hidratação** na aba Início ou Dieta!`
          };
        }

        // 2) CALORIAS / TMB / EMAGRECER / GANHAR MASSA / SECAR / DÉFICIT / SUPERÁVIT
        if (/(caloria|kcal|tmb|metabolismo|emagrec|secar|perder peso|ganhar massa|hipertrofia|bulking|cutting|deficit|superavit|meta cal)/.test(q)) {
          return {
            text: `🔥 **Cálculo pronto na fórmula Mifflin-St Jeor, ${ctx.name}!**\n\nCom base nos seus dados (**${ctx.sex === 'M' ? 'Masculino' : 'Feminino'}, ${ctx.age} anos, ${ctx.height} cm, ${ctx.weight} kg**) e ritmo de **${weeklyCount} treinos/sem**:\n• **Taxa Metabólica Basal (TMB):** ~**${plan.tmb.toLocaleString('pt-BR')} kcal**\n• **Gasto Total Diário (TDEE):** ~**${plan.tdee.toLocaleString('pt-BR')} kcal**\n• **Meta sugerida para ${ctx.objective}:** **${plan.suggestedKcal.toLocaleString('pt-BR')} kcal/dia**\n\n*Por quê?* ${plan.strategyNote}\n**Divisão base:** ${plan.proteinG}g proteína • ${plan.carbG}g carbo • ${plan.fatG}g gordura.`,
            applyKcal: plan.suggestedKcal,
            applyProtein: plan.proteinG
          };
        }

        // 3) MACROS / PROTEÍNA / CARBO / GORDURA / SUPLEMENTOS (CREATINA, WHEY, PRÉ-TREINO)
        if (/(macro|proteina|carbo|gordura|creatina|whey|suplement|pre[- ]?treino|cafeina|albumina|pos[- ]?treino)/.test(q)) {
          const creatG = Math.max(3, Math.min(6, Math.round(ctx.weight * 0.07)));
          return {
            text: `🍗 **Macros e Suplementação para ${ctx.name} (${ctx.weight} kg):**\n\n• **Proteína:** **${plan.proteinG}g/dia** (~${Math.round(plan.proteinG / 4)}g em 4 refeições) — essencial pra recuperar e construir músculo.\n• **Carboidratos:** **${plan.carbG}g/dia** — concentre boa parte 1–2h antes do treino/esporte e no pós-treino.\n• **Gorduras boas:** **${plan.fatG}g/dia** (azeite, abacate, castanhas, gema).\n\n**Sobre suplementos:**\n• **Creatina:** **${creatG}g todos os dias** (inclusive no descanso, qualquer horário, junto com água/refeição).\n• **Whey:** praticidade pura pra bater sua proteína no lanche ou pós-treino.\n• **Pré-treino:** banana + aveia ou pão com mel 45–60 min antes já entrega energia limpa; cafeína (200 mg) ajuda se não atrapalhar seu sono.`
          };
        }

        // 4) VÔLEI
        if (/(volei|quadra|salto|impuls|saque|bloqueio)/.test(q)) {
          return {
            text: `🏐 **Dicas do Manu para mandar bem no Vôlei:**\n\n• **Impulsão e salto:** inclua na musculação agachamento, levantamento terra/stiff, panturrilha explosiva e saltos pliométricos (box jump) 1–2x na semana com foco em qualidade, não fadiga extrema.\n• **Proteção de ombro e tornozelo:** faça 5 min de aquecimento de manguito rotador (rotação externa com elástico) antes do jogo e fortaleça tibiais/panturrilhas para aterrissagens seguras.\n• **Energia pré-jogo:** 40–60g de carboidrato leve 1h antes + **${(plan.waterTrainMl / 1000).toFixed(1).replace('.', ',')} L** de água ao longo do dia pra evitar câimbras no 3º set!`
          };
        }

        // 5) TÊNIS
        if (/(tenis|raquete|cotovelo|forehand|backhand)/.test(q)) {
          return {
            text: `🎾 **Dicas do Manu para evoluir no Tênis:**\n\n• **Deslocamento lateral & core:** trabalhe passadas laterais, afundo lateral e rotação de tronco (lenhador no cabo/medicine ball) — a potência do golpe vem do quadril e do core.\n• **Prevenção de cotovelo e ombro:** fortaleça antebraço (flexão/extensão de punho leve) e manguito rotador para evitar epicondilite.\n• **Hidratação em quadra:** jogos longos no calor drenam sódio rápido. Beba água a cada troca de lado e leve uma fruta ou bebida com eletrólitos se passar de 60 min.`
          };
        }

        // 6) CORRIDA
        if (/(corrida|correr|pace|km|maratona|joelho|canelite|cadencia|trote)/.test(q)) {
          return {
            text: `🏃 **Dicas do Manu para sua Corrida:**\n\n• **Regra de ouro do pace:** 80% das corridas devem ser em ritmo confortável (onde você consegue falar frases curtas) e só 20% em tiro/ritmo forte.\n• **Blindar joelhos e evitar canelite:** fortaleça glúteo médio, quadríceps e panturrilha 2x na semana, e mire uma cadência próxima de **170–180 passos/min** (passada mais curta reduz o impacto).\n• **Pré-corrida:** para treinos de até 40 min, algo leve (banana ou pão com geleia 30–45 min antes) já basta. Acima de 60 min, reforce carboidrato e água!`
          };
        }

        // 7) NATAÇÃO
        if (/(natacao|nadar|piscina|crawl|ombro|respiracao)/.test(q)) {
          return {
            text: `🏊 **Dicas do Manu para a Natação:**\n\n• **Respiração e eficiência:** tente alternar a respiração bilateral (a cada 3 braçadas) e soltar o ar continuamente debaixo d'água — segurar a respiração cansa muito mais rápido.\n• **Saúde dos ombros:** capriche na mobilidade torácica e no fortalecimento de escápulas (remada baixa, face pull) na musculação.\n• **Recuperação:** a água mascara o suor, mas você perde líquido igual! Deixe uma garrafinha na borda da piscina e faça um lanche com proteína + carbo logo depois.`
          };
        }

        // 8) MUSCULAÇÃO / PROGRESSÃO DE CARGA / DESCANSO / FALHA
        if (/(musculacao|carga|progredir|serie|repetic|falha|rir|descanso|divisao|treino)/.test(q)) {
          return {
            text: `🏋️ **Guia direto de Musculação com o Manu:**\n\n• **Progressão dupla (simples e infalível):** se a meta é 3×10–12 reps, comece com uma carga onde faça 10 reps sólidas. Quando conseguir fazer **12 reps nas 3 séries com boa execução**, suba **1–2 kg** nos halteres ou **2,5–5 kg** nas máquinas.\n• **Descanso ideal:** **60–90s** para exercícios isoladores (elevação lateral, rosca) e **2–3 min** para compostos pesados (agachamento, supino, puxada). Use o cronômetro fixo na aba Treinos!\n• **RIR / Falha:** treine deixando **1 a 2 repetições na reserva** na maioria das séries e deixe a falha técnica só pra última série de exercícios seguros.`
          };
        }

        // 9) %BF / GORDURA / IMC / EVOLUÇÃO / RECOMPOSIÇÃO
        if (/(bf|gordura|imc|recompos|evoluc|analis|cintura|peso|balanca|faixa)/.test(q)) {
          const bfVal = prof.bodyFat !== null ? prof.bodyFat : (prof.sex === 'F' ? 22 : 15);
          const tier = getBfTiersForReference(prof.sex)[classifyBfTier(bfVal, prof.sex)];
          return {
            text: `📈 **Raio-X da sua Evolução, ${prof.name}:**\n\n• **Fase atual:** **${diag.icon} ${diag.title}**\n• **Dados:** ${prof.weight.toFixed(1).replace('.', ',')} kg • ${prof.height} cm (IMC ${diag.imc}) • **${bfVal.toFixed(1).replace('.', ',')}% BF**\n• **Sua faixa nas 9 categorias:** **${tier.displayRange} — ${tier.title}**\n  *(${tier.desc})*\n\n**Resumo recente:** peso ${diag.weightDiff >= 0 ? '+' : ''}${diag.weightDiff.toFixed(1).replace('.', ',')} kg | carga média **+${diag.loadPct}%**${prof.waist !== null ? ` | cintura ${diag.waistDiff >= 0 ? '+' : ''}${diag.waistDiff.toFixed(1).replace('.', ',')} cm` : ''}.\n\n${diag.detailText}`
          };
        }

        // 10) SONO / RECUPERAÇÃO / AQUECIMENTO / ALONGAMENTO / DORES
        if (/(sono|dormir|recupera|aquec|along|dor|lesao|doms|cansac|fadiga)/.test(q)) {
          return {
            text: `🔋 **Recuperação, Aquecimento e Dores:**\n\n• **Dor muscular tardia (DOMS) vs Dor articular:** dor espalhada no ventre do músculo 24–48h depois é normal (adaptação). Dor aguda, pontual em articulação (joelho, ombro, lombar) ou que piora durante o exercício é sinal de parar e revisar carga/técnica.\n• **Aquecimento inteligente:** antes de treinar, faça 3–5 min de mobilidade articular + 2 séries leves do 1º exercício (50% e 75% da carga). Deixe alongamentos estáticos longos para o pós-treino ou outro horário.\n• **Sono:** dormir menos de 7h derruba força, piora a fome e atrasa a recuperação muscular.`
          };
        }

        // 11) DÚVIDAS SOBRE O APP
        if (/(app|aplicativo|como usar|planilha|editar|grafico|desfazer|cronometro|perfil)/.test(q)) {
          return {
            text: `📱 **Tô aqui pra te guiar no ManuFit Clube:**\n\n• **Perfis:** use **✏️ Editar** ao lado do seu nome para ajustar medidas/objetivo, ou **+ Criar Perfil** para cadastrar amigos.\n• **Planilha de Treinos:** na aba **Treinos**, clique em **✏️ Editar Planilha** para escolher o esporte de cada dia (Musculação, Vôlei, Tênis, Corrida, Natação ou Descanso) e em **+ Exercício** para adicionar exercícios.\n• **Gráficos automáticos:** todo exercício da sua planilha aparece automaticamente na aba **Evolução**, e cada série marcada com **✓** alimenta o gráfico!\n• **Excluiu sem querer?** Aparece o botão **Desfazer** por 6 segundos lá embaixo.`
          };
        }

        // 12) DICA GERAL DE ESPORTE (quando clicar no chip de Vôlei/Esporte ou falar "esporte")
        if (/(esporte|dica)/.test(q)) {
          const spList = sportsInWeek.length > 0 ? sportsInWeek.join(', ') : 'Musculação e esportes';
          return {
            text: `⚡ **Fala, ${prof.name}! Vi na sua semana: ${spList}.**\n\n• **Combine força + esporte:** evite fazer perna pesada até a falha no mesmo dia de um jogo intenso de vôlei/tênis ou corrida longa.\n• **Hidratação em dia de jogo:** mire **${(plan.waterTrainMl / 1000).toFixed(2).replace('.', ',')} L** de água.\n• **Pré-treino simples:** carboidrato leve 45–60 min antes pra manter o ritmo alto do começo ao fim.\n\nQuer uma orientação específica de **Vôlei, Tênis, Corrida, Natação ou Musculação**? É só mandar!`
          };
        }

        // 13) FALLBACK NATURAL, ÚTIL E MASCULINO (NUNCA TRAVA DIZENDO PARA CLICAR NOS BOTÕES)
        const spSummary = sportsInWeek.length > 0 ? sportsInWeek.join(', ') : 'seus treinos';
        return {
          text: `Fala, **${prof.name}**! Tô pronto pra te ajudar nisso.\n\nOlhando seu perfil atual (**${prof.weight.toFixed(1).replace('.', ',')} kg**, **${prof.height} cm**, objetivo **${prof.objective}** e rotina com **${spSummary}**), já consigo calcular pra você:\n• **Água ideal:** ${(plan.waterBaseMl / 1000).toFixed(2).replace('.', ',')} L/dia (até ${(plan.waterTrainMl / 1000).toFixed(2).replace('.', ',')} L em dias pesados)\n• **Calorias estimadas:** ~${plan.suggestedKcal.toLocaleString('pt-BR')} kcal/dia com ${plan.proteinG}g de proteína\n\nMe diz com mais detalhes o que você quer ajustar — pode perguntar sobre **hidratação, calorias, macros, suplementos, progressão de carga, dores, sono** ou algum dos esportes (**vôlei, tênis, corrida, natação e musculação**) que eu te respondo na hora!`
        };
      }

        calculateCaloriesWithManuIA() {
          const name = (document.getElementById('pf-name')?.value || activeProfile().name || 'Atleta').trim();
          const sex = document.getElementById('pf-sex')?.value || 'M';
          const age = parseInt(document.getElementById('pf-age')?.value || '', 10);
          const height = parseInt(document.getElementById('pf-height')?.value || '', 10);
          const weight = parseFloat(document.getElementById('pf-weight')?.value || '');
          const objective = document.getElementById('pf-objective')?.value || 'Manutenção Atlética';

          const errEl = document.getElementById('pf-error');
          if (!age || !height || !weight) {
            if (errEl) {
              errEl.textContent = 'Preencha Idade, Altura e Peso Atual primeiro para o Manu IA calcular sua meta exata.';
              errEl.classList.remove('hidden');
            }
            return;
          }
          if (errEl) errEl.classList.add('hidden');

          ui.profileDraftContext = { name, sex, age, height, weight, objective, fromForm: true };
          const reply = generateManuAIResponse('calcular meta de calorias tmb', activeProfile(), ui.profileDraftContext);

          ui.aiMessages.push({ role: 'user', text: `Manu, calcula minha meta de calorias (${sex === 'M' ? 'M' : 'F'}, ${age} anos, ${height}cm, ${weight}kg, objetivo: ${objective})` });
          ui.aiMessages.push({ role: 'ai', text: reply.text, applyKcal: reply.applyKcal, applyProtein: reply.applyProtein });

          const aiBackdrop = document.getElementById('ai-backdrop');
          if (aiBackdrop) {
            aiBackdrop.classList.remove('hidden');
            aiBackdrop.classList.add('flex');
          }
          renderAIMessages();
        },

        applyAICalorieGoal(kcal, protein) {
          const kcalInput = document.getElementById('pf-kcal');
          if (kcalInput && ui.profileDraftContext?.fromForm) {
            kcalInput.value = kcal;
            this.closeAssistantModal();
            showToast(`Meta de ${kcal.toLocaleString('pt-BR')} kcal aplicada no formulário!`);
            return;
          }
          // Caso tenha sido acionado fora do formulário de perfil, salva direto no perfil ativo
          const prof = activeProfile();
          prof.calorieGoal = kcal;
          if (protein) prof.proteinGoal = protein;
          saveState();
          this.closeAssistantModal();
          renderApp();
          showToast(`Meta de ${kcal.toLocaleString('pt-BR')} kcal salva no perfil!`);
        },

        saveProfileForm(mode) {
          const name = (document.getElementById('pf-name')?.value || '').trim();
          const sex = document.getElementById('pf-sex')?.value || 'M';
          const age = parseInt(document.getElementById('pf-age')?.value || '', 10);
          const height = parseInt(document.getElementById('pf-height')?.value || '', 10);
          const weight = parseFloat(document.getElementById('pf-weight')?.value || '');
          const objective = document.getElementById('pf-objective')?.value || 'Hipertrofia';

          const errEl = document.getElementById('pf-error');
          if (!name || !age || !height || !weight) {
            if (errEl) {
              errEl.textContent = 'Preencha todos os campos obrigatórios (*): Nome, Sexo, Idade, Altura, Peso Atual e Objetivo.';
              errEl.classList.remove('hidden');
            }
            return;
          }

          const rawGoalW = (document.getElementById('pf-goal-weight')?.value || '').trim();
          const rawBf = (document.getElementById('pf-bf')?.value || '').trim();
          const rawWaist = (document.getElementById('pf-waist')?.value || '').trim();
          const rawKcal = (document.getElementById('pf-kcal')?.value || '').trim();

          const goalWeight = rawGoalW !== '' ? parseFloat(rawGoalW) : null;
          const bodyFat = rawBf !== '' ? parseFloat(rawBf) : null;
          const waist = rawWaist !== '' ? parseFloat(rawWaist) : null;

          const autoCalc = calculateNutritionPlan({ sex, age, height, weight, objective, weeklyWorkouts: 4 });
          const calorieGoal = rawKcal !== '' ? parseInt(rawKcal, 10) : autoCalc.suggestedKcal;

          if (mode === 'edit') {
            const p = activeProfile();
            p.name = name;
            p.sex = sex;
            p.age = age;
            p.height = height;
            p.weight = weight;
            p.objective = objective;
            p.goalWeight = goalWeight;
            p.bodyFat = bodyFat;
            p.waist = waist;
            p.calorieGoal = calorieGoal;
            p.proteinGoal = autoCalc.proteinG;
            if (p.measurements.length > 0) {
              const last = p.measurements[p.measurements.length - 1];
              last.weight = weight;
              if (waist !== null) last.waist = waist;

        deleteExercise(exId) {
          const prof = activeProfile();
          const list = prof.schedule[ui.selectedDay]?.exercises || [];
          const idx = list.findIndex(e => e.id === exId);
          if (idx === -1) return;

          const removed = list.splice(idx, 1)[0];
          saveState();
          renderApp();

          // Configura buffer de Desfazer por 6 segundos
          if (ui.undoBuffer && ui.undoBuffer.timeoutId) {
            clearTimeout(ui.undoBuffer.timeoutId);
          }
          ui.undoBuffer = {
            profileId: prof.id,
            dayKey: ui.selectedDay,
            index: idx,
            exercise: removed,
            timeoutId: setTimeout(() => {
              hideUndoSnackbar();
              ui.undoBuffer = null;
            }, 6000)
          };
          showUndoSnackbar(removed.name);
        },

        undoDeleteExercise() {
          if (!ui.undoBuffer) return;
          const { profileId, dayKey, index, exercise, timeoutId } = ui.undoBuffer;
          clearTimeout(timeoutId);
          const prof = state.profiles[profileId];
          if (prof && prof.schedule[dayKey]) {
            const safeIdx = Math.min(index, prof.schedule[dayKey].exercises.length);
            prof.schedule[dayKey].exercises.splice(safeIdx, 0, exercise);
            saveState();
            ui.activeTab = 'workouts';
            ui.selectedDay = dayKey;
            renderApp();
            showToast(`'${exercise.name}' restaurado!`);
          }
          ui.undoBuffer = null;
          hideUndoSnackbar();

              prof.schedule = {};

        setTimerPreset(sec) {
          stopAlarmLoop();
          if (ui.timer.intervalId) {
            clearInterval(ui.timer.intervalId);
            ui.timer.intervalId = null;
          }
          ui.timer.running = false;
          ui.timer.totalSeconds = sec;
          ui.timer.secondsLeft = sec;
          renderApp();
        },

        applyCustomTimer() {
          const m = Math.max(0, Math.min(59, parseInt(document.getElementById('custom-timer-min')?.value || '0', 10) || 0));
          const s = Math.max(0, Math.min(59, parseInt(document.getElementById('custom-timer-sec')?.value || '0', 10) || 0));
          const total = m * 60 + s;
          if (total <= 0) return showToast('Informe um tempo maior que 0s');
          this.setTimerPreset(total);
          showToast(`Cronômetro ajustado para ${formatClock(total)}`);
        },

        toggleTimer() {
          stopAlarmLoop();
          if (ui.timer.running) {
            clearInterval(ui.timer.intervalId);
            ui.timer.intervalId = null;
            ui.timer.running = false;
            syncTimerDOM();
          } else {
            if (ui.timer.secondsLeft <= 0) {
              ui.timer.secondsLeft = ui.timer.totalSeconds || 60;
            }
            ui.timer.running = true;
            ui.timer.intervalId = setInterval(() => {
              if (ui.timer.secondsLeft > 0) {
                ui.timer.secondsLeft -= 1;
                syncTimerDOM();
              }
              if (ui.timer.secondsLeft <= 0) {
                clearInterval(ui.timer.intervalId);
                ui.timer.intervalId = null;
                ui.timer.running = false;
                startAlarmLoop();
                syncTimerDOM();
                showToast('⏱ Tempo de descanso finalizado!');
              }
            }, 1000);
            syncTimerDOM();
          }
        },

        resetTimer() {
          stopAlarmLoop();
          if (ui.timer.intervalId) {
            clearInterval(ui.timer.intervalId);
            ui.timer.intervalId = null;
          }
          ui.timer.running = false;
          ui.timer.secondsLeft = ui.timer.totalSeconds || 60;
          syncTimerDOM();
        },

        stopAlarmAndReset() {
          this.resetTimer();
        },

              <button onclick="MF.closeModal(); MF.openAssistantModal(); MF.askQuickQuestion('📈 Analisar minha evolução');"
                class="py-2.5 rounded-xl bg-gradient-to-r from-cyan-500 to-emerald-500 text-slate-950 font-display font-extrabold text-xs">
                ✨ Aprofundar com Manu IA
              </button>
            </div>
          `);
        },

        // ======================== DIETA: ÁGUA & REFEIÇÕES ========================
        addWater(ml) {
          const prof = activeProfile();
          prof.waterConsumedMl = (Number(prof.waterConsumedMl) || 0) + ml;
          saveState();
          renderApp();
          showToast(`+${ml} ml de água registrados! 💧`);
        },

        resetWater() {
          const prof = activeProfile();
          prof.waterConsumedMl = 0;
          saveState();
          renderApp();
          showToast('Contador de água zerado');
        },

        openMealModal() {
          openModal(`
            <div class="flex items-center justify-between">
              <h3 class="font-display font-extrabold text-lg">Adicionar Refeição</h3>
              <button onclick="MF.closeModal()" class="text-slate-400 hover:text-rose-500 font-bold">✕</button>
            </div>
            <div class="space-y-3">
              <div class="grid grid-cols-3 gap-2.5">
                <div>
                  <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">Horário</label>
                  <input id="ml-time" type="time" value="16:00"
                    class="w-full rounded-xl bg-slate-100 dark:bg-[#0b0f14] border border-slate-300 dark:border-[#222d3b] px-2.5 py-2 text-sm font-semibold" />
                </div>
                <div class="col-span-2">
                  <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">Nome *</label>
                  <input id="ml-name" type="text" placeholder="Ex: Ceia Proteica"
                    class="w-full rounded-xl bg-slate-100 dark:bg-[#0b0f14] border border-slate-300 dark:border-[#222d3b] px-3 py-2 text-sm font-semibold" />
                </div>
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">Descrição dos alimentos</label>
                <input id="ml-desc" type="text" placeholder="Ex: Iogurte natural, aveia e frutas"
                  class="w-full rounded-xl bg-slate-100 dark:bg-[#0b0f14] border border-slate-300 dark:border-[#222d3b] px-3 py-2 text-sm font-semibold" />
              </div>
              <div class="grid grid-cols-4 gap-2">
                <div>
                  <label class="block text-[11px] font-bold text-slate-500 mb-1">kcal</label>
                  <input id="ml-kcal" type="number" placeholder="350"
                    class="w-full rounded-xl bg-slate-100 dark:bg-[#0b0f14] border border-slate-300 dark:border-[#222d3b] px-2 py-2 text-sm font-semibold" />
                </div>
                <div>
                  <label class="block text-[11px] font-bold text-cyan-500 mb-1">Prot (g)</label>
                  <input id="ml-p" type="number" placeholder="28"
                    class="w-full rounded-xl bg-slate-100 dark:bg-[#0b0f14] border border-slate-300 dark:border-[#222d3b] px-2 py-2 text-sm font-semibold" />
                </div>
                <div>
                  <label class="block text-[11px] font-bold text-emerald-500 mb-1">Carb (g)</label>
                  <input id="ml-c" type="number" placeholder="35"
                    class="w-full rounded-xl bg-slate-100 dark:bg-[#0b0f14] border border-slate-300 dark:border-[#222d3b] px-2 py-2 text-sm font-semibold" />
                </div>
                <div>
                  <label class="block text-[11px] font-bold text-amber-500 mb-1">Gord (g)</label>
                  <input id="ml-g" type="number" placeholder="8"
                    class="w-full rounded-xl bg-slate-100 dark:bg-[#0b0f14] border border-slate-300 dark:border-[#222d3b] px-2 py-2 text-sm font-semibold" />
                </div>
              </div>
              <button onclick="MF.saveMeal()"
                class="w-full py-3 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-display font-extrabold text-sm">
                Adicionar Refeição
              </button>
            </div>
          `);
        },

        saveMeal() {
          const name = (document.getElementById('ml-name')?.value || '').trim();
          if (!name) return showToast('Digite o nome da refeição');
          const time = document.getElementById('ml-time')?.value || '12:00';
          const desc = (document.getElementById('ml-desc')?.value || '').trim();
          const p = parseInt(document.getElementById('ml-p')?.value || '0', 10) || 0;
          const c = parseInt(document.getElementById('ml-c')?.value || '0', 10) || 0;
          const g = parseInt(document.getElementById('ml-g')?.value || '0', 10) || 0;
          const rawKcal = parseInt(document.getElementById('ml-kcal')?.value || '0', 10) || 0;
          const kcal = rawKcal > 0 ? rawKcal : (p * 4 + c * 4 + g * 9);

          activeProfile().meals.push({ id: 'meal_' + Date.now(), time, name, desc, kcal, p, c, g, done: false });
          saveState();
          closeModal();
          renderApp();
          showToast('Refeição adicionada!');
        },

        toggleMealDone(id) {
          const meal = activeProfile().meals.find(m => m.id === id);
          if (!meal) return;
          meal.done = !meal.done;
          saveState();
          renderApp();
        },

        deleteMeal(id) {
          const prof = activeProfile();
          prof.meals = prof.meals.filter(m => m.id !== id);
          saveState();
          renderApp();
          showToast('Refeição removida');
        },

        // ======================== GALERA: COMPARTILHAR & BACKUP JSON ========================
        copyClubLink() {
          const input = document.getElementById('club-share-url');
          if (!input) return;
          try {
            input.select();
            input.setSelectionRange(0, 99999);
            document.execCommand('copy');
            showToast('Link copiado! Cole no WhatsApp da galera.');
          } catch (err) {
            showToast('Copie o link diretamente na caixa acima.');
          }
        },

        exportJSON() {
          try {
            const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `manufit-clube-backup.json`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
            showToast('Backup JSON baixado!');
          } catch (err) {
            showToast('Não foi possível exportar o arquivo.');
          }
        },

        openImportJSONModal() {
          openModal(`
            <div class="flex items-center justify-between">
              <h3 class="font-display font-extrabold text-lg">Importar Fichas (JSON)</h3>
              <button onclick="MF.closeModal()" class="text-slate-400 hover:text-rose-500 font-bold">✕</button>
            </div>
            <p class="text-xs text-slate-500 dark:text-slate-400">Cole abaixo o conteúdo de um arquivo JSON exportado do ManuFit Clube.</p>
            <textarea id="import-json-text" rows="6" placeholder='{"profiles": { ... }}'
              class="w-full rounded-xl bg-slate-100 dark:bg-[#0b0f14] border border-slate-300 dark:border-[#222d3b] p-3 text-xs font-mono focus:outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
            <button onclick="MF.confirmImportJSON()"
              class="w-full py-3 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-display font-extrabold text-sm">
              Importar Dados
            </button>
          `);
        },

        confirmImportJSON() {
          try {
            const raw = (document.getElementById('import-json-text')?.value || '').trim();
            const parsed = JSON.parse(raw);
            if (!parsed || typeof parsed !== 'object' || !parsed.profiles) {
              throw new Error('Estrutura inválida');
            }
            localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
            state = loadState();
            saveState();
            closeModal();
            renderApp();
            showToast('Fichas importadas com sucesso!');
          } catch (err) {
            showToast('JSON inválido. Verifique o conteúdo colado.');
          }
        },

        // ======================== ASSISTENTE MANU IA (MASCULINO) ========================
        openAssistantModal() {
          const prof = activeProfile();
          if (ui.aiMessages.length === 0) {
            ui.aiMessages.push({
              role: 'ai',
              text: `Fala, **${prof.name}**! Sou o **Manu**, seu parceiro de treino e saúde aqui no clube.\n\nTô conectado aos seus dados reais (**${prof.weight.toFixed(1).replace('.', ',')} kg**, **${prof.height} cm**, objetivo **${prof.objective}**) e pronto pra te ajudar com **hidratação, calorias, macros, suplementos, musculação, vôlei, tênis, corrida, natação** e análise da sua evolução. Pode mandar sua dúvida!`
            });
          }
          const backdrop = document.getElementById('ai-backdrop');
          if (backdrop) {
            backdrop.classList.remove('hidden');
            backdrop.classList.add('flex');
          }
          renderAIMessages();
        },

        closeAssistantModal() {
          const backdrop = document.getElementById('ai-backdrop');
          if (backdrop) {
            backdrop.classList.add('hidden');
            backdrop.classList.remove('flex');
          }
          ui.profileDraftContext = null;
        },

        askQuickQuestion(q) {
          const prof = activeProfile();
          ui.aiMessages.push({ role: 'user', text: q });
          const reply = generateManuAIResponse(q, prof, ui.profileDraftContext);
          ui.aiMessages.push({ role: 'ai', text: reply.text, applyKcal: reply.applyKcal, applyProtein: reply.applyProtein });
          renderAIMessages();
        },

        sendAssistantMessage(event) {
          event.preventDefault();
          const input = document.getElementById('ai-input');
          if (!input) return;
          const text = input.value.trim();
          if (!text) return;
          input.value = '';

          const prof = activeProfile();
          ui.aiMessages.push({ role: 'user', text });
          const reply = generateManuAIResponse(text, prof, ui.profileDraftContext);
          ui.aiMessages.push({ role: 'ai', text: reply.text, applyKcal: reply.applyKcal, applyProtein: reply.applyProtein });
          renderAIMessages();
        },

        closeModal
      };

      // ======================== INICIALIZAÇÃO SEGURA ========================
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', renderApp);
      } else {
        renderApp();
      }
    })();
  </script>
</body>
</html>
