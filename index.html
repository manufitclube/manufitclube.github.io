<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ManuFit Clube</title>

  <!-- Meta Tags Open Graph e Ícones Oficiais (WhatsApp & App Icon) -->
  <link rel="icon" type="image/png" href="https://manufitclube.github.io/capa.png" />
  <link rel="apple-touch-icon" href="https://manufitclube.github.io/capa.png" />
  <meta property="og:title" content="ManuFit Clube" />
  <meta property="og:description" content="Treinos, evolução de cargas e dieta da galera." />
  <meta property="og:image" content="https://manufitclube.github.io/capa.png" />
  <meta property="og:url" content="https://manufitclube.github.io/" />
  <meta property="og:type" content="website" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'Inter', 'sans-serif']
          }
        }
      }
    };
  </script>

  <!-- Fontes Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-page: #f4f6f9;
      --bg-card: #ffffff;
      --bg-subtle: #eef2f6;
      --border-card: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
    }

    html.dark {
      --bg-page: #0b0f14;
      --bg-card: #141b24;
      --bg-subtle: #1a2330;
      --border-card: #222d3b;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .font-display {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
    }

    .card-box {
      background-color: var(--bg-card);
      border: 1px solid var(--border-card);
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    /* Único elemento fixo ao rolar na aba Treinos */
    .cronometro-sticky {
      position: sticky;
      top: 8px;
      z-index: 30;
      background-color: #ffffff;
      box-shadow: 0 12px 28px -6px rgba(15, 23, 42, 0.16);
    }

    html.dark .cronometro-sticky {
      background-color: #141b24;
      box-shadow: 0 14px 32px -6px rgba(0, 0, 0, 0.82);
    }

    /* Card de Diagnóstico Dinâmico */
    .diag-card-emerald {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.12) 0%, rgba(6, 182, 212, 0.12) 55%, rgba(59, 130, 246, 0.12) 100%);
      border: 1px solid rgba(16, 185, 129, 0.42);
      box-shadow: 0 0 24px -8px rgba(16, 185, 129, 0.25);
    }
    .diag-card-cyan {
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.14) 0%, rgba(59, 130, 246, 0.12) 60%, rgba(99, 102, 241, 0.12) 100%);
      border: 1px solid rgba(6, 182, 212, 0.45);
      box-shadow: 0 0 24px -8px rgba(6, 182, 212, 0.28);
    }
    .diag-card-amber {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.13) 0%, rgba(249, 115, 22, 0.12) 60%, rgba(16, 185, 129, 0.10) 100%);
      border: 1px solid rgba(245, 158, 11, 0.42);
      box-shadow: 0 0 24px -8px rgba(245, 158, 11, 0.24);
    }

    /* Card de Exercício 100% Concluído (degradê verde e ciano) */
    .exercise-done-card {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.16) 0%, rgba(20, 184, 166, 0.13) 50%, rgba(6, 182, 212, 0.18) 100%);
      border: 1px solid rgba(16, 185, 129, 0.58);
      box-shadow: 0 10px 26px -10px rgba(6, 182, 212, 0.35);
      transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    html.dark .exercise-done-card {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.20) 0%, rgba(13, 148, 136, 0.16) 50%, rgba(6, 182, 212, 0.22) 100%);
      border: 1px solid rgba(34, 211, 238, 0.52);
      box-shadow: 0 12px 28px -10px rgba(16, 185, 129, 0.32);
    }

    /* Remove setas nativas de inputs numéricos */
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }

    /* Scrollbar sutil para trilhos horizontais */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="pb-28">

  <!-- Toast de Notificação (topo) -->
  <div id="toast-box" class="fixed top-4 left-1/2 -translate-x-1/2 z-[70] pointer-events-none transition-all duration-200 opacity-0 -translate-y-3">
    <div id="toast-msg" class="px-4 py-2.5 rounded-2xl bg-slate-900 dark:bg-emerald-500 text-white dark:text-slate-950 font-semibold text-xs sm:text-sm shadow-xl border border-white/10 whitespace-nowrap"></div>
  </div>

  <!-- Barra Flutuante de Desfazer (Undo) acima da navegação inferior -->
  <div id="undo-snackbar" class="fixed bottom-20 left-1/2 -translate-x-1/2 z-[65] w-[92%] max-w-md pointer-events-none transition-all duration-250 opacity-0 translate-y-4">
    <div class="pointer-events-auto flex items-center justify-between gap-3 px-4 py-3 rounded-2xl bg-slate-900 dark:bg-[#1a2330] text-slate-100 border border-slate-700 dark:border-cyan-500/40 shadow-2xl">
      <div class="flex items-center gap-2.5 min-w-0">
        <span class="text-amber-400 text-sm shrink-0">🗑️</span>
        <span id="undo-text" class="text-xs sm:text-sm font-semibold truncate">Exercício removido</span>
      </div>
      <button onclick="MF.undoDeleteExercise()"
        class="px-3 py-1.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-display font-extrabold text-xs shrink-0 active:scale-95 transition">
        Desfazer
      </button>
    </div>
  </div>

  <!-- CABEÇALHO SUPERIOR (ROLA NORMALMENTE COM A PÁGINA — NÃO É FIXO/STICKY) -->
  <header class="w-full bg-white dark:bg-[#141b24] border-b border-slate-200 dark:border-[#222d3b] px-3 sm:px-6 py-3">
    <div class="max-w-3xl mx-auto flex flex-wrap items-center justify-between gap-2">
      <!-- Marca (capa.png com fallback estilizado) + Seletor de Perfil + Botão claro ✏️ Editar -->
      <div class="flex items-center gap-2 min-w-0">
        <div class="w-9 h-9 rounded-xl overflow-hidden bg-gradient-to-br from-blue-600 via-cyan-500 to-sky-400 flex items-center justify-center text-white font-display font-extrabold text-base shadow-sm shrink-0">
          <img src="https://manufitclube.github.io/capa.png" alt="ManuFit Clube"
            class="w-full h-full object-cover"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
          <span class="hidden w-full h-full items-center justify-center font-display font-extrabold text-base text-white">M</span>
        </div>

        <select id="profile-selector" onchange="MF.switchProfile(this.value)" aria-label="Selecionar Perfil"
          class="bg-slate-100 dark:bg-[#0b0f14] border border-slate-200 dark:border-[#222d3b] text-slate-900 dark:text-slate-100 text-xs sm:text-sm font-bold rounded-xl px-2.5 sm:px-3 py-2 focus:outline-none focus:ring-2 focus:ring-cyan-500 max-w-[125px] sm:max-w-[170px]">
        </select>

        <button onclick="MF.openProfileModal('edit')" title="Editar Perfil"
          class="px-2.5 py-2 rounded-xl bg-slate-100 dark:bg-[#1a2330] border border-slate-200 dark:border-[#222d3b] text-slate-700 dark:text-slate-200 hover:border-cyan-500 text-xs font-bold flex items-center gap-1 transition active:scale-95 shrink-0">
          <span>✏️</span><span>Editar Perfil</span>
        </button>
      </div>

      <!-- Ações: + Criar Perfil, Manu IA (discreto) e Tema -->
      <div class="flex items-center gap-1.5 sm:gap-2">
        <button onclick="MF.openProfileModal('create')"
          class="px-3 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-600 active:scale-[0.98] text-slate-950 font-display font-extrabold text-xs sm:text-sm shadow-sm transition">
          + Criar Perfil
        </button>

        <button onclick="MF.openAssistantModal()" title="Manu IA — Seu parceiro de treino e saúde" aria-label="Abrir Manu IA"
          class="p-2 rounded-xl bg-gradient-to-br from-cyan-500/15 to-emerald-500/15 border border-cyan-500/35 text-cyan-600 dark:text-cyan-300 hover:border-cyan-400 active:scale-95 transition flex items-center justify-center">
          <span class="text-sm leading-none">✨</span>
        </button>

        <button onclick="MF.toggleTheme()" title="Alternar Tema" aria-label="Alternar Tema"
          class="p-2 rounded-xl bg-slate-100 dark:bg-[#1a2330] border border-slate-200 dark:border-[#222d3b] text-amber-500 dark:text-amber-400 hover:border-amber-400 transition">
          <svg class="w-4 h-4 hidden dark:block" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="5" />
            <path stroke-linecap="round" d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
          </svg>
          <svg class="w-4 h-4 block dark:hidden text-slate-700" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main id="app-content" class="max-w-3xl mx-auto px-3.5 sm:px-6 pt-4 space-y-5"></main>

  <!-- MODAL GENÉRICO (Perfis, Exercício, Planilha, Medidas, Refeição, Diagnóstico, JSON) -->
  <div id="modal-backdrop" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/75 backdrop-blur-xs p-3 sm:p-4 overflow-hidden">
    <div id="modal-panel" class="w-full max-w-lg rounded-2xl bg-white dark:bg-[#141b24] border border-slate-200 dark:border-[#222d3b] p-5 shadow-2xl space-y-4 my-auto max-h-[90vh] overflow-y-auto"></div>
  </div>

  <!-- MODAL DO ASSISTENTE MANU IA (MASCULINO — PARCEIRO DE TREINO E SAÚDE) -->
  <div id="ai-backdrop" class="fixed inset-0 z-[55] hidden items-end sm:items-center justify-center bg-black/75 backdrop-blur-xs sm:p-4">
    <div class="w-full sm:max-w-lg h-[84vh] sm:h-[80vh] rounded-t-3xl sm:rounded-2xl bg-white dark:bg-[#141b24] border-t sm:border border-slate-200 dark:border-[#222d3b] shadow-2xl flex flex-col overflow-hidden">
      <div class="px-4 py-3.5 border-b border-slate-200 dark:border-[#222d3b] flex items-center justify-between bg-slate-50/80 dark:bg-[#0b0f14]/80">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-600 via-cyan-500 to-emerald-500 flex items-center justify-center text-white text-base shadow-sm shrink-0">
            ✨
          </div>
          <div>
            <h3 class="font-display font-extrabold text-sm sm:text-base leading-tight">Manu IA • Seu parceiro de treino</h3>
            <p id="ai-profile-context" class="text-[11px] text-slate-500 dark:text-slate-400">Conectado aos seus dados reais</p>
          </div>
        </div>
        <button onclick="MF.closeAssistantModal()" class="p-2 rounded-xl text-slate-400 hover:text-rose-500 hover:bg-rose-500/10 font-bold transition">✕</button>
      </div>

      <div id="ai-messages" class="flex-1 overflow-y-auto p-4 space-y-3"></div>

      <div class="px-3.5 py-2 border-t border-slate-200 dark:border-[#222d3b] bg-slate-50/70 dark:bg-[#0b0f14]/60">
        <div id="ai-chips" class="flex items-center gap-1.5 overflow-x-auto pb-1 no-scrollbar"></div>
      </div>

      <form onsubmit="MF.sendAssistantMessage(event)" class="p-3 border-t border-slate-200 dark:border-[#222d3b] flex items-center gap-2 bg-white dark:bg-[#141b24]">
        <input id="ai-input" type="text" placeholder="Pergunte sobre água, calorias, vôlei, corrida, treino..."
          class="flex-1 rounded-xl bg-slate-100 dark:bg-[#0b0f14] border border-slate-300 dark:border-[#222d3b] px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500" />
        <button type="submit"
          class="px-4 py-2.5 rounded-xl bg-gradient-to-r from-cyan-500 to-emerald-500 hover:opacity-95 text-slate-950 font-display font-extrabold text-sm shadow-sm shrink-0">
          Enviar
        </button>
      </form>
    </div>
  </div>

  <!-- NAVEGAÇÃO INFERIOR FIXA (5 ABAS) -->
  <nav class="fixed bottom-0 inset-x-0 z-40 bg-white/95 dark:bg-[#141b24]/95 backdrop-blur-md border-t border-slate-200 dark:border-[#222d3b] px-2 py-2">
    <div id="bottom-nav" class="max-w-3xl mx-auto grid grid-cols-5 gap-1"></div>
  </nav>

  <script>
    (function () {
      // Versionamento seguro para evitar travamentos por dados antigos no celular
      const STORAGE_KEY = 'manufit_clube_v5';

      const DAYS_ORDER = ['seg', 'ter', 'qua', 'qui', 'sex', 'sab', 'dom'];
      const DAY_LABELS = {
        seg: 'Segunda-feira', ter: 'Terça-feira', qua: 'Quarta-feira',
        qui: 'Quinta-feira', sex: 'Sexta-feira', sab: 'Sábado', dom: 'Domingo'
      };
      const DAY_SHORT = {
        seg: 'Seg', ter: 'Ter', qua: 'Qua', qui: 'Qui', sex: 'Sex', sab: 'Sáb', dom: 'Dom'
      };

      const OBJECTIVES = [
        'Hipertrofia',
        'Emagrecimento',
        'Recomposição Corporal',
        'Manutenção Atlética',
        'Performance Esportiva'
      ];

      const SPORTS_LIST = ['Musculação', 'Vôlei', 'Tênis', 'Corrida', 'Natação', 'Descanso'];

      const SPORT_META = {
        'Musculação': { icon: '🏋️', badge: 'bg-cyan-500/15 text-cyan-600 dark:text-cyan-400 border-cyan-500/30', metricLabel: 'Foco do dia' },
        'Vôlei': { icon: '🏐', badge: 'bg-amber-500/15 text-amber-600 dark:text-amber-400 border-amber-500/30', metricLabel: 'Sets / Partidas' },
        'Tênis': { icon: '🎾', badge: 'bg-lime-500/15 text-lime-600 dark:text-lime-400 border-lime-500/30', metricLabel: 'Games / Sets' },
        'Corrida': { icon: '🏃', badge: 'bg-rose-500/15 text-rose-600 dark:text-rose-400 border-rose-500/30', metricLabel: 'Distância (km)' },
        'Natação': { icon: '🏊', badge: 'bg-sky-500/15 text-sky-600 dark:text-sky-400 border-sky-500/30', metricLabel: 'Distância (m)' },
        'Descanso': { icon: '😴', badge: 'bg-slate-500/15 text-slate-600 dark:text-slate-400 border-slate-500/30', metricLabel: 'Recuperação' }
      };

      const DEFAULT_SPORT_TITLES = {
        'Musculação': 'Treino de Musculação',
        'Vôlei': 'Treino de Vôlei',
        'Tênis': 'Treino de Tênis',
        'Corrida': 'Treino de Corrida',
        'Natação': 'Treino de Natação',
        'Descanso': 'Recuperação Ativa'
      };

      // ======================== 9 FAIXAS OFICIAIS DE % DE GORDURA ========================
      const BF_TIERS_BASE = [
        {
          id: 0, min: 1, max: 4,
          rangeLabel: '1% a 4%',
          shortTitle: 'Definição Extrema',
          title: 'Definição Extrema (Fisiculturismo)',
          grad: 'bg-gradient-to-r from-indigo-500 to-purple-600',
          desc: 'Limite fisiológico para competição. Pele extremamente fina, fibras musculares totalmente visíveis e vascularização máxima.'
        },
        {
          id: 1, min: 5, max: 7,
          rangeLabel: '5% a 7%',
          shortTitle: 'Atleta Competição',
          title: 'Atleta de Competição',
          grad: 'bg-gradient-to-r from-blue-600 to-cyan-400',
          desc: 'Altíssima definição muscular. Abdominais e intercostais totalmente nítidos e baixíssima retenção de água.'
        },
        {
          id: 2, min: 8, max: 10,
          rangeLabel: '8% a 10%',
          shortTitle: 'Padrão Estético',
          title: 'Padrão Estético (Atleta)',
          grad: 'bg-gradient-to-r from-cyan-500 to-teal-400',
          desc: 'Excelente definição. O "six-pack" é visível sem contrair, com ótima estética muscular e veias aparentes nos braços.'
        },
        {
          id: 3, min: 11, max: 12,
          rangeLabel: '11% a 12%',
          shortTitle: 'Definição Atlética',
          title: 'Definição Atlética',
          grad: 'bg-gradient-to-r from-teal-500 to-emerald-400',
          desc: 'Físico atlético e sustentável. Gomos do abdômen visíveis, mas com menos veias aparentes na região central.'
        },
        {
          id: 4, min: 13, max: 15,
          rangeLabel: '13% a 15%',
          shortTitle: 'Boa Forma',
          title: 'Boa Forma (Fitness)',
          grad: 'bg-gradient-to-r from-emerald-500 to-green-400',
          desc: 'Aparência saudável e muscular. Linhas laterais do abdômen visíveis sob boa iluminação e pouca gordura na cintura.'
        },
        {
          id: 5, min: 16, max: 19,
          rangeLabel: '16% a 19%',
          shortTitle: 'Média Saudável',
          title: 'Média Saudável',
          grad: 'bg-gradient-to-r from-lime-500 to-yellow-400',
          desc: 'Musculatura firme, mas sem gomos aparentes. Uma camada fina de gordura cobre a definição abdominal.'
        },
        {
          id: 6, min: 20, max: 24,
          rangeLabel: '20% a 24%',
          shortTitle: 'Excesso Leve',
          title: 'Excesso Leve',
          grad: 'bg-gradient-to-r from-yellow-500 to-amber-500',
          desc: 'Físico mais arredondado. Pouca separação entre os músculos e início de acúmulo de gordura nas laterais da cintura.'
        },
        {
          id: 7, min: 25, max: 30,
          rangeLabel: '25% a 30%',
          shortTitle: 'Obesidade Mod.',
          title: 'Obesidade Moderada',
          grad: 'bg-gradient-to-r from-orange-500 to-red-500',
          desc: 'Nenhuma definição muscular visível. Acúmulo nítido de gordura no abdômen, peitoral e flancos.'
        },
        {
          id: 8, min: 35, max: 40,
          rangeLabel: '35% a 40%',
          shortTitle: 'Obesidade Avanç.',
          title: 'Obesidade Avançada',
          grad: 'bg-gradient-to-r from-red-600 to-rose-800',
          desc: 'Alto acúmulo de tecido adiposo no tronco. Curvatura abdominal acentuada e riscos elevados para a saúde metabólica.'
        }
      ];

      function escapeHtml(str) {
        return String(str ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function getBfTiersForReference(refMode) {
        const offset = refMode === 'F' ? 7 : 0;
        return BF_TIERS_BASE.map(t => ({
          ...t,
          adjMin: t.min + offset,
          adjMax: t.max + offset,
          displayRange: offset === 0 ? t.rangeLabel : `${t.min + offset}% a ${t.max + offset}%`
        }));
      }

      function classifyBfTier(bf, refMode) {
        const offset = refMode === 'F' ? 7 : 0;
        const normalized = (Number(bf) || 15) - offset;
        if (normalized <= 4.5) return 0;
        if (normalized <= 7.5) return 1;
        if (normalized <= 10.5) return 2;
        if (normalized <= 12.5) return 3;
        if (normalized <= 15.5) return 4;
        if (normalized <= 19.5) return 5;
        if (normalized <= 24.5) return 6;
        if (normalized <= 32.5) return 7;
        return 8;
      }

      function getBfMarkerPercent(bf, refMode) {
        const offset = refMode === 'F' ? 7 : 0;
        const n = Math.max(1, Math.min(40, (Number(bf) || 15) - offset));
        const tierIdx = classifyBfTier(bf, refMode);
        const segWidth = 100 / 9;
        const t = BF_TIERS_BASE[tierIdx];
        const tMin = tierIdx === 8 ? 32.5 : t.min;
        const tMax = tierIdx === 7 ? 32.5 : t.max;
        const localRatio = Math.max(0, Math.min(1, (n - tMin) / Math.max(1, tMax - tMin)));
        return Math.max(2, Math.min(98, tierIdx * segWidth + localRatio * segWidth));
      }

      // ======================== CÁLCULOS FISIOLÓGICOS (MIFFLIN-ST JEOR + ÁGUA) ========================
      function calculateNutritionPlan({ sex, age, height, weight, objective, weeklyWorkouts }) {
        const w = Number(weight) || 75;
        const h = Number(height) || 175;
        const a = Number(age) || 28;
        const isMale = sex !== 'F';
        const tmb = Math.round(10 * w + 6.25 * h - 5 * a + (isMale ? 5 : -161));

        const days = Number(weeklyWorkouts) || 4;
        const activityFactor = days >= 6 ? 1.65 : (days >= 4 ? 1.55 : (days >= 2 ? 1.42 : 1.28));
        const tdee = Math.round(tmb * activityFactor);

        let delta = 0;
        let strategyNote = 'Equilíbrio calórico para sustentar performance e massa magra.';
        if (objective === 'Emagrecimento') {
          delta = -Math.round(tdee * 0.16);
          strategyNote = 'Déficit moderado (~16%) para perder gordura preservando força e massa muscular.';
        } else if (objective === 'Hipertrofia') {
          delta = Math.round(tdee * 0.12);
          strategyNote = 'Superávit limpo (~12%) para construir músculo minimizando ganho de gordura.';
        } else if (objective === 'Recomposição Corporal') {
          delta = -Math.round(tdee * 0.06);
          strategyNote = 'Leve déficit (~6%) com proteína alta para secar medidas enquanto sobe cargas.';
        } else if (objective === 'Performance Esportiva') {
          delta = Math.round(tdee * 0.08);
          strategyNote = 'Combustível extra em carboidratos para alto rendimento nos treinos e esportes.';
        }

        const suggestedKcal = Math.max(1300, Math.round((tdee + delta) / 10) * 10);
        const proteinG = Math.round(w * (objective === 'Emagrecimento' || objective === 'Recomposição Corporal' ? 2.1 : 1.9));
        const fatG = Math.round(w * 0.85);
        const carbG = Math.max(80, Math.round((suggestedKcal - proteinG * 4 - fatG * 9) / 4));
        const waterBaseMl = Math.round(w * 35);
        const waterTrainMl = Math.round(w * 45);

        return { tmb, tdee, suggestedKcal, strategyNote, proteinG, carbG, fatG, waterBaseMl, waterTrainMl };
      }

      // ======================== GASTO CALÓRICO PERSONALIZADO POR TREINO ========================
      // Usa peso, altura, idade, sexo e % de gordura (massa magra via Katch-McArdle + Mifflin-St Jeor)
      function getPersonalBmrPerMin(prof) {
        const w = Number(prof.weight) || 75;
        const h = Number(prof.height) || 172;
        const a = Number(prof.age) || 28;
        const isMale = prof.sex !== 'F';
        const mifflin = 10 * w + 6.25 * h - 5 * a + (isMale ? 5 : -161);

        let bmrPersonal = mifflin;
        if (prof.bodyFat !== null && prof.bodyFat !== undefined && prof.bodyFat !== '') {
          const bf = Math.min(50, Math.max(4, Number(prof.bodyFat)));
          const leanMass = w * (1 - bf / 100);
          const katch = 370 + 21.6 * leanMass;
          // Combina massa magra (%BF) com sexo/idade/altura para refletir todas as variáveis do perfil
          bmrPersonal = 0.55 * katch + 0.45 * mifflin;
        }
        return Math.max(0.7, bmrPersonal / 1440);
      }

      function calculateSetCalories(prof, log) {
        const w = Number(prof.weight) || 75;
        const bmrPerMin = getPersonalBmrPerMin(prof);
        const kg = Math.max(0, parseFloat(log?.kg) || 0);
        const reps = Math.max(1, parseInt(log?.reps, 10) || 10);
        // Volume mecânico da série (ou estimativa corporal se carga não foi preenchida)
        const effectiveTonnage = kg > 0 ? kg * reps : w * 0.35 * reps;
        const intensityFactor = 1 + Math.min(0.65, effectiveTonnage / Math.max(1, w * 14));
        return bmrPerMin * 5.0 * 1.35 * intensityFactor;
      }

      function calculateExerciseBurn(prof, ex) {
        const logs = Array.isArray(ex?.logs) ? ex.logs : [];
        let burned = 0;
        let planned = 0;
        let doneSets = 0;
        logs.forEach(row => {
          const c = calculateSetCalories(prof, row);
          planned += c;
          if (row.done) {
            burned += c;
            doneSets += 1;
          }
        });
        return {
          burnedKcal: Math.round(burned),
          plannedKcal: Math.round(planned),
          doneSets,
          totalSets: logs.length
        };
      }

      function calculateWorkoutBurn(prof, dayKey) {
        const dayPlan = prof.schedule?.[dayKey];
        if (!dayPlan || dayPlan.sport === 'Descanso') {
          return { burnedKcal: 0, plannedKcal: 0, doneSets: 0, totalSets: 0, sportBurned: 0, sportPlanned: 0 };
        }

        let burned = 0;
        let planned = 0;
        let doneSets = 0;
        let totalSets = 0;

        (dayPlan.exercises || []).forEach(ex => {
          const exB = calculateExerciseBurn(prof, ex);
          burned += exB.burnedKcal;
          planned += exB.plannedKcal;
          doneSets += exB.doneSets;
          totalSets += exB.totalSets;
        });

        let sportBurned = 0;
        let sportPlanned = 0;
        if (dayPlan.sport !== 'Musculação') {
          const sLog = dayPlan.sportLog || makeSportLog();
          const duration = Math.max(0, Number(sLog.duration) || 0);
          const metTable = {
            'Vôlei': { Leve: 4.5, Moderada: 6.0, Intensa: 8.0 },
            'Tênis': { Leve: 5.0, Moderada: 7.0, Intensa: 8.5 },
            'Corrida': { Leve: 7.0, Moderada: 9.5, Intensa: 11.5 },
            'Natação': { Leve: 5.8, Moderada: 8.0, Intensa: 10.0 }
          };
          const met = (metTable[dayPlan.sport] && metTable[dayPlan.sport][sLog.intensity]) || 6.0;
          sportPlanned = Math.round(getPersonalBmrPerMin(prof) * met * duration);
          if (sLog.done) sportBurned = sportPlanned;
          burned += sportBurned;
          planned += sportPlanned;
        }

        return {
          burnedKcal: Math.round(burned),
          plannedKcal: Math.round(planned),
          doneSets,
          totalSets,
          sportBurned,
          sportPlanned
        };
      }

      // Carregamento ultra-seguro do localStorage com validação estrutural
      function loadState() {
        const defaults = createDefaultData();
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return defaults;
          const parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== 'object' || !parsed.profiles) return defaults;

          const mergedProfiles = {};
          const keys = Object.keys(parsed.profiles);
          if (keys.length === 0) return defaults;

          keys.forEach(id => {
            const p = parsed.profiles[id] || {};
            const base = defaults.profiles[id] || defaults.profiles.manu;
            const mergedSchedule = {};
            DAYS_ORDER.forEach(d => {
              const savedDay = p.schedule && p.schedule[d] ? p.schedule[d] : base.schedule[d];
              const validSport = SPORT_META[savedDay?.sport] ? savedDay.sport : 'Musculação';
              mergedSchedule[d] = {
                sport: validSport,
                title: savedDay?.title || base.schedule[d].title,
                sportLog: savedDay?.sportLog ? { ...makeSportLog(), ...savedDay.sportLog } : makeSportLog(),
                exercises: Array.isArray(savedDay?.exercises) ? savedDay.exercises : []
              };
            });

            mergedProfiles[id] = {
              ...base,
              ...p,
              age: Number(p.age) || base.age || 29,
              sex: p.sex === 'M' || p.sex === 'F' ? p.sex : (base.sex || 'M'),
              height: Number(p.height) || base.height || 172,
              weight: Number(p.weight) || base.weight || 80,
              goalWeight: p.goalWeight !== null && p.goalWeight !== undefined && p.goalWeight !== '' ? Number(p.goalWeight) : null,
              waist: p.waist !== null && p.waist !== undefined && p.waist !== '' ? Number(p.waist) : null,
              bodyFat: p.bodyFat !== null && p.bodyFat !== undefined && p.bodyFat !== '' ? Number(p.bodyFat) : null,
              calorieGoal: Number(p.calorieGoal) || base.calorieGoal || 2400,
              proteinGoal: Number(p.proteinGoal) || base.proteinGoal || 150,
              objective: OBJECTIVES.includes(p.objective) ? p.objective : (base.objective || 'Manutenção Atlética'),
              waterConsumedMl: Number(p.waterConsumedMl) || 0,
              measurements: Array.isArray(p.measurements) && p.measurements.length > 0 ? p.measurements : base.measurements,
              exerciseHistory: (p.exerciseHistory && typeof p.exerciseHistory === 'object') ? p.exerciseHistory : base.exerciseHistory,
              schedule: mergedSchedule,
              meals: Array.isArray(p.meals) ? p.meals : base.meals
            };
          });

          const activeId = mergedProfiles[parsed.activeProfileId] ? parsed.activeProfileId : keys[0];
          return {
            schemaVersion: 5,
            theme: parsed.theme === 'light' ? 'light' : 'dark',
            activeProfileId: activeId,
            profiles: mergedProfiles
          };
        } catch (err) {
          return defaults;
        }
      }

      let state = loadState();

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (err) {
          console.warn('localStorage indisponível:', err);

      // Dia real da semana no sistema
      function getTodayDayKey() {
        const jsDay = new Date().getDay(); // 0=Dom..6=Sab
        const map = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sab'];
        return map[jsDay] || 'ter';

      // Estado da interface — abre na aba Início com navegação instantânea
      let ui = {
        activeTab: 'home',

        chartMetric: 'kg', // 'kg' | 'reps' | 'volume'

        }

      function activeProfile() {

      function getActiveBfRefMode(prof) {
        return ui.bfRefOverride || prof.sex || 'M';
      }

      function getWeeklyActiveDaysCount(prof) {
        return DAYS_ORDER.filter(d => prof.schedule[d] && prof.schedule[d].sport !== 'Descanso').length;
      }

      // Coleta 100% dinâmica de todos os exercícios da planilha semanal + histórico salvo
      function getSyncedExerciseNames(prof) {
        const seen = new Map(); // lower -> display name
        DAYS_ORDER.forEach(d => {
          const exList = prof.schedule[d]?.exercises || [];
          exList.forEach(ex => {
            const clean = (ex.name || '').trim();
            if (clean && !seen.has(clean.toLowerCase())) {
              seen.set(clean.toLowerCase(), clean);
            }
          });
        });
        Object.keys(prof.exerciseHistory || {}).forEach(name => {
          const clean = name.trim();
          if (clean && !seen.has(clean.toLowerCase())) {
            seen.set(clean.toLowerCase(), clean);
          }
        });
        return Array.from(seen.values());
      }

      function getExercisePoints(prof, exName) {
        if (prof.exerciseHistory && Array.isArray(prof.exerciseHistory[exName]) && prof.exerciseHistory[exName].length > 0) {
          return prof.exerciseHistory[exName];
        }
        // Se for exercício recém-adicionado sem histórico ainda, lê da planilha atual
        for (const d of DAYS_ORDER) {
          const found = (prof.schedule[d]?.exercises || []).find(e => e.name.toLowerCase() === exName.toLowerCase());
          if (found) {
            const bestLog = found.logs.find(l => Number(l.kg) > 0) || found.logs[0] || { kg: 0, reps: 10 };
            const now = new Date();
            const dt = `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}`;
            return [{ date: dt, kg: parseFloat(bestLog.kg) || 0, reps: parseInt(bestLog.reps, 10) || 10 }];
          }
        }
        return [{ date: 'Hoje', kg: 0, reps: 0 }];
      }

      function recordExerciseHistoryPoint(prof, exName, kg, reps) {
        const cleanName = (exName || '').trim();
        if (!cleanName) return;
        const numKg = parseFloat(kg) || 0;
        const numReps = parseInt(reps, 10) || 0;
        if (numKg <= 0 && numReps <= 0) return;

        if (!prof.exerciseHistory) prof.exerciseHistory = {};
        if (!Array.isArray(prof.exerciseHistory[cleanName])) prof.exerciseHistory[cleanName] = [];

        const now = new Date();
        const todayStr = `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}`;
        const list = prof.exerciseHistory[cleanName];
        const last = list[list.length - 1];

        if (last && last.date === todayStr) {
          // Mantém o melhor desempenho do dia (maior carga ou maior volume)
          if (numKg > last.kg || (numKg === last.kg && numReps > last.reps)) {
            last.kg = numKg;
            last.reps = numReps;
          }
        } else {
          list.push({ date: todayStr, kg: numKg, reps: numReps });
        }
      }

      // ======================== DIAGNÓSTICO DINÂMICO REAL (SEM TEXTO FIXO ENGESSADO) ========================
      function computeDynamicDiagnosis(prof) {
        const list = prof.measurements || [];
        const first = list[0] || { weight: prof.weight, waist: prof.waist || 80, bf: prof.bodyFat || 15, avgLoadIdx: 100 };
        const last = list[list.length - 1] || first;
        const prev = list.length > 1 ? list[list.length - 2] : first;

        const weightDiff = +(last.weight - first.weight).toFixed(1);
        const weeklyWeightDiff = +(last.weight - prev.weight).toFixed(1);
        const waistDiff = prof.waist !== null ? +((last.waist || prof.waist) - (first.waist || prof.waist)).toFixed(1) : 0;
        const bfDiff = prof.bodyFat !== null ? +((last.bf || prof.bodyFat) - (first.bf || prof.bodyFat)).toFixed(1) : 0;
        const loadPct = Math.round(((last.avgLoadIdx - first.avgLoadIdx) / Math.max(1, first.avgLoadIdx)) * 100);

        const bfVal = prof.bodyFat !== null ? prof.bodyFat : (prof.sex === 'F' ? 22 : 15);
        const normBf = bfVal - (prof.sex === 'F' ? 7 : 0); // Normalizado na base masculina
        const imc = +(prof.weight / Math.pow((prof.height || 172) / 100, 2)).toFixed(1);

        let icon = '📊';
        let title = 'Evolução Consistente';
        let cardClass = 'diag-card-cyan';
        let titleColor = 'text-cyan-600 dark:text-cyan-400';
        let shortText = '';
        let detailText = '';
        let focusTips = [];

        // 1) Físico atlético com baixa gordura e alta massa muscular (ex: Manu 1,72m, 80kg, 12% BF)
        if (normBf <= 13.5 && prof.objective !== 'Emagrecimento') {
          if (prof.objective === 'Hipertrofia' || weightDiff >= 0.8) {
            icon = '💪';
            title = 'Ganho de Massa Limpa';
            cardClass = 'diag-card-emerald';
            titleColor = 'text-emerald-600 dark:text-emerald-400';
            shortText = `Com ${bfVal.toFixed(1).replace('.', ',')}% de gordura e cargas subindo +${loadPct}%, você está construindo massa muscular de qualidade mantendo a definição sob controle.`;
            detailText = `Seu perfil mostra uma base muscular sólida (${prof.weight.toFixed(1).replace('.', ',')} kg para ${prof.height} cm) aliada a um %BF baixo (${bfVal.toFixed(1).replace('.', ',')}%). O peso variou ${weightDiff >= 0 ? '+' : ''}${weightDiff.toFixed(1).replace('.', ',')} kg enquanto a carga média subiu +${loadPct}%, indicando excelente aproveitamento calórico para hipertrofia limpa.`;
          } else {
            icon = '🏆';
            title = 'Alta Performance & Definição Atlética';
            cardClass = 'diag-card-cyan';
            titleColor = 'text-cyan-600 dark:text-cyan-400';
            shortText = `Físico já consolidado (${prof.weight.toFixed(1).replace('.', ',')} kg • ${bfVal.toFixed(1).replace('.', ',')}% BF). Suas cargas subiram +${loadPct}% mantendo a cintura firme (${prof.waist ? prof.waist.toFixed(1).replace('.', ',') + ' cm' : 'estável'}).`;
            detailText = `Com ${prof.height} cm, ${prof.weight.toFixed(1).replace('.', ',')} kg e ${bfVal.toFixed(1).replace('.', ',')}% de gordura, seu corpo já está em patamar atlético — por isso o foco aqui não é recomposição iniciante, e sim performance, progressão de força (+${loadPct}% nas últimas semanas) e preservação da definição.`;
          }
          focusTips = [
            'Priorize progressão de carga gradual nos exercícios compostos e qualidade técnica.',
            'Garanta carboidratos suficientes antes dos treinos e esportes para sustentar o rendimento.',
            'Mantenha o sono acima de 7h para recuperação neural e articular.'
          ];
        }
        // 2) Definição / Emagrecimento progressivo claro
        else if (prof.objective === 'Emagrecimento' || (weightDiff <= -1.0 && waistDiff <= -1.0)) {
          icon = '🔥';
          title = 'Definição Progressiva em Alta';
          cardClass = 'diag-card-amber';
          titleColor = 'text-amber-600 dark:text-amber-400';
          shortText = `Você eliminou ${Math.abs(weightDiff).toFixed(1).replace('.', ',')} kg e reduziu ${Math.abs(waistDiff).toFixed(1).replace('.', ',')} cm de cintura mantendo a força (+${loadPct}% carga média).`;
          detailText = `Seu déficit calórico está funcionando do jeito certo: o peso caiu ${weightDiff.toFixed(1).replace('.', ',')} kg, a cintura afinou ${waistDiff.toFixed(1).replace('.', ',')} cm e o %BF recuou ${bfDiff.toFixed(1).replace('.', ',')}%, sem despencar suas cargas na musculação.`;
          focusTips = [
            'Mantenha a proteína alta (~2g/kg) para segurar massa magra durante o corte.',
            'Não corte calorias de forma drástica: perdas de 0,5% a 0,8% do peso por semana são as mais sustentáveis.',
            'Continue registrando suas cargas para garantir que a força se mantenha estável.'
          ];
        }
        // 3) Recomposição Corporal REAL (%BF moderado/alto + peso estável + cintura caindo + carga subindo)
        else if (normBf >= 13.5 && Math.abs(weightDiff) <= 0.8 && waistDiff < -0.5 && loadPct >= 5) {
          icon = '⚡';
          title = 'Recomposição Corporal em Andamento';
          cardClass = 'diag-card-emerald';
          titleColor = 'text-emerald-600 dark:text-emerald-400';
          shortText = `Na balança o peso ficou quase estável (${weightDiff >= 0 ? '+' : ''}${weightDiff.toFixed(1).replace('.', ',')} kg), mas sua carga subiu +${loadPct}% e a cintura diminuiu ${waistDiff.toFixed(1).replace('.', ',')} cm.`;
          detailText = `Este é o cenário clássico de recomposição corporal: embora o ponteiro da balança tenha variado apenas ${weightDiff >= 0 ? '+' : ''}${weightDiff.toFixed(1).replace('.', ',')} kg, você reduziu ${Math.abs(waistDiff).toFixed(1).replace('.', ',')} cm de cintura, baixou o %BF em ${Math.abs(bfDiff).toFixed(1).replace('.', ',')}% e aumentou a carga média em +${loadPct}%.`;
          focusTips = [
            'Não desanime se a balança oscilar pouco — acompanhe cintura, fotos e cargas.',
            'Bata sua meta diária de proteína e hidratação para otimizar a troca de gordura por músculo.',
            'Busque progredir 1 repetição ou 1–2 kg nos exercícios-chave a cada 2 semanas.'
          ];
        }
        // 4) Diagnóstico Geral Inteligente
        else {
          icon = '📈';
          title = `Fase de ${prof.objective || 'Evolução'}`;
          cardClass = 'diag-card-cyan';
          titleColor = 'text-cyan-600 dark:text-cyan-400';
          shortText = `Variação recente: ${weightDiff >= 0 ? '+' : ''}${weightDiff.toFixed(1).replace('.', ',')} kg na balança, carga média +${loadPct}% e %BF em ${bfVal.toFixed(1).replace('.', ',')}%.`;
          detailText = `Seus dados atuais (${prof.weight.toFixed(1).replace('.', ',')} kg, ${prof.height} cm, IMC ${imc}) estão alinhados ao objetivo "${prof.objective}". Continue registrando treinos e medidas semanalmente para acompanhar tendências ainda mais precisas.`;
          focusTips = [
            'Registre novas medidas a cada 7 ou 14 dias sempre no mesmo horário (em jejum).',
            'Anote as cargas e repetições feitas na aba Treinos para alimentar seu gráfico.'
          ];
        }

        return { icon, title, cardClass, titleColor, shortText, detailText, focusTips, weightDiff, weeklyWeightDiff, waistDiff, bfDiff, loadPct, imc, list };
      }

      // ======================== TOAST, UNDO & TEMA ========================
      let toastTimeout = null;
      function showToast(text) {

      function applyTheme() {
        document.documentElement.classList.toggle('dark', state.theme === 'dark');
      }

      // ======================== WEB AUDIO ALARME DO CRONÔMETRO ========================
      let audioCtx = null;
      function playAlarmBeep() {
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          if (!audioCtx) audioCtx = new AC();
          if (audioCtx.state === 'suspended') audioCtx.resume();

          const now = audioCtx.currentTime;
          [0, 0.22, 0.44].forEach((offset, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(idx === 2 ? 1046.5 : 880, now + offset);
            gain.gain.setValueAtTime(0.001, now + offset);
            gain.gain.exponentialRampToValueAtTime(0.28, now + offset + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.17);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + offset);
            osc.stop(now + offset + 0.18);
          });
        } catch (e) {}
      }

      function startAlarmLoop() {
        stopAlarmLoop();
        ui.timer.alarming = true;
        playAlarmBeep();
        ui.timer.alarmIntervalId = setInterval(playAlarmBeep, 1150);
      }

      function stopAlarmLoop() {
        ui.timer.alarming = false;
        if (ui.timer.alarmIntervalId) {
          clearInterval(ui.timer.alarmIntervalId);
          ui.timer.alarmIntervalId = null;
        }
      }

      function formatClock(sec) {
        const s = Math.max(0, Math.floor(sec));
        return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
      }

      function getTimerPhase() {
        if (ui.timer.alarming) {
          return { text: 'text-rose-500', bar: 'bg-gradient-to-r from-red-600 to-rose-500', border: 'border-rose-500', iconBg: 'bg-rose-500/15 text-rose-500' };
        }
        const ratio = ui.timer.totalSeconds > 0 ? ui.timer.secondsLeft / ui.timer.totalSeconds : 1;
        if (ratio <= 0.15) return { text: 'text-rose-500', bar: 'bg-gradient-to-r from-red-600 to-rose-500', border: 'border-rose-500/75', iconBg: 'bg-rose-500/15 text-rose-500' };
        if (ratio <= 0.45) return { text: 'text-amber-500', bar: 'bg-gradient-to-r from-amber-500 to-orange-500', border: 'border-amber-500/75', iconBg: 'bg-amber-500/15 text-amber-500' };
        return { text: 'text-cyan-500', bar: 'bg-gradient-to-r from-blue-500 via-cyan-500 to-emerald-400', border: 'border-cyan-500/55', iconBg: 'bg-cyan-500/15 text-cyan-500' };
      }

      function syncTimerDOM() {
        const card = document.getElementById('rest-timer-card');
        const clock = document.getElementById('rest-timer-clock');
        const iconBox = document.getElementById('rest-timer-icon');
        const bar = document.getElementById('rest-timer-bar');
        const actions = document.getElementById('rest-timer-actions');
        if (!card || !clock || !bar || !actions) return;

        const phase = getTimerPhase();
        const pct = ui.timer.totalSeconds > 0 ? Math.max(0, Math.min(100, (ui.timer.secondsLeft / ui.timer.totalSeconds) * 100)) : 0;

        card.className = `cronometro-sticky rounded-2xl border-2 ${phase.border} p-4 transition-colors`;
        clock.textContent = formatClock(ui.timer.secondsLeft);
        clock.className = `font-display font-extrabold text-3xl sm:text-4xl tracking-tight leading-none ${phase.text}`;
        if (iconBox) iconBox.className = `w-11 h-11 rounded-xl flex items-center justify-center text-lg shrink-0 ${phase.iconBg}`;
        bar.style.width = `${pct}%`;
        bar.className = `h-full rounded-full transition-all duration-300 ${phase.bar}`;

        if (ui.timer.alarming) {
          actions.innerHTML = `
            <button onclick="MF.stopAlarmAndReset()"
              class="col-span-2 py-3 px-4 rounded-xl bg-rose-500 hover:bg-rose-600 text-white font-display font-extrabold text-sm sm:text-base flex items-center justify-center gap-2 shadow-lg shadow-rose-500/30 animate-pulse transition">
              <span>🔇</span> Parar Alarme / Reiniciar
            </button>
          `;
        } else {
          const toggleLabel = ui.timer.running ? '⏸ Pausar' : '▶ Iniciar';
          const toggleStyle = ui.timer.running
            ? 'bg-amber-500 hover:bg-amber-600 text-slate-950 shadow-amber-500/20'
            : 'bg-emerald-500 hover:bg-emerald-600 text-slate-950 shadow-emerald-500/20';
          actions.innerHTML = `
            <button onclick="MF.toggleTimer()"
              class="py-3 px-4 rounded-xl ${toggleStyle} font-display font-extrabold text-sm sm:text-base flex items-center justify-center gap-2 shadow-md active:scale-[0.98] transition">
              ${toggleLabel}
            </button>
            <button onclick="MF.resetTimer()"
              class="py-3 px-4 rounded-xl bg-slate-100 dark:bg-[#1a2330] hover:bg-slate-200 dark:hover:bg-[#222d3b] border border-slate-300 dark:border-[#222d3b] text-slate-800 dark:text-slate-100 font-display font-bold text-sm sm:text-base flex items-center justify-center gap-2 active:scale-[0.98] transition">
              ↺ Reiniciar
            </button>
          `;
        }
      }

      function getWeekDatesMap() {
        const now = new Date();
        const dayIdx = now.getDay();
        const diffToMon = dayIdx === 0 ? -6 : 1 - dayIdx;
        const monday = new Date(now);
        monday.setDate(now.getDate() + diffToMon);

        const map = {};
        DAYS_ORDER.forEach((key, idx) => {
          const d = new Date(monday);
          d.setDate(monday.getDate() + idx);
          map[key] = `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}`;
        });
        return map;
      }

      // ======================== ABA 1: INÍCIO ========================
      function renderHomeTab(prof) {
        const weekDates = getWeekDatesMap();
        const todayKey = getTodayDayKey();
        const todayPlan = prof.schedule[todayKey] || prof.schedule.ter;
        const todaySport = SPORT_META[todayPlan.sport] || SPORT_META['Musculação'];
        const diag = computeDynamicDiagnosis(prof);

        const refMode = prof.sex || 'M';
        const bfVal = prof.bodyFat !== null ? prof.bodyFat : null;
        const bfTier = bfVal !== null ? getBfTiersForReference(refMode)[classifyBfTier(bfVal, refMode)] : null;

        // Contabilização das calorias gastas no treino (peso, idade, sexo, %BF, séries, reps e carga)
        const todayBurn = calculateWorkoutBurn(prof, todayKey);
        const selectedBurn = calculateWorkoutBurn(prof, ui.selectedDay);
        const burnDayKey = (todayBurn.burnedKcal > 0 || selectedBurn.burnedKcal === 0) ? todayKey : ui.selectedDay;
        const activeBurn = burnDayKey === todayKey ? todayBurn : selectedBurn;
        const burnProgressPct = activeBurn.plannedKcal > 0
          ? Math.min(100, Math.round((activeBurn.burnedKcal / activeBurn.plannedKcal) * 100))
          : 0;

          if (m.done) { acc.kcal += m.kcal; acc.p += m.p; acc.c += m.c; acc.g += m.g; }
          return acc;
        }, { kcal: 0, p: 0, c: 0, g: 0 });

        // Meta total do dia somando a base do perfil + calorias gastas nos exercícios concluídos
        const totalDailyCalorieTarget = prof.calorieGoal + activeBurn.burnedKcal;
        const kcalPct = Math.min(100, Math.round((totals.kcal / Math.max(1, totalDailyCalorieTarget)) * 100));
        const remainingKcal = Math.max(0, totalDailyCalorieTarget - totals.kcal);

        const waterTarget = Math.round((prof.weight || 75) * 35);
        const waterPct = Math.min(100, Math.round(((prof.waterConsumedMl || 0) / Math.max(1, waterTarget)) * 100));

        return `
          <!-- Saudação + Status Rápido do Perfil -->
          <div class="flex items-center justify-between gap-2">
            <div>
              <h1 class="font-display font-extrabold text-xl sm:text-2xl">Fala, ${escapeHtml(prof.name)}! 👋</h1>

              ✨ Perguntar ao Manu

          <!-- Card Peso vs Meta & %BF nas 9 Faixas -->
          <button onclick="MF.setTab('evolution')"
            class="w-full card-box rounded-2xl p-4 sm:p-5 text-left hover:border-emerald-500/60 transition group">
            <div class="flex flex-wrap items-start justify-between gap-3">
              <div>
                <span class="text-[11px] font-extrabold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                  Resumo Corporal
                </span>
                <div class="flex items-baseline gap-2.5 mt-1">
                  <span class="font-display font-extrabold text-2xl sm:text-3xl">${prof.weight.toFixed(1).replace('.', ',')} kg</span>
                  ${prof.goalWeight !== null
                    ? `<span class="text-xs font-semibold text-slate-500 dark:text-slate-400">Meta: ${prof.goalWeight.toFixed(1).replace('.', ',')} kg</span>`
                    : `<span class="text-xs font-semibold text-slate-500 dark:text-slate-400">${prof.height} cm</span>`}
                </div>
                <div class="flex flex-wrap items-center gap-2 mt-2.5">
                  ${bfTier ? `
                    <span class="px-2.5 py-0.5 rounded-full text-[11px] font-extrabold text-white shadow-xs ${bfTier.grad}">
                      ${bfVal.toFixed(1).replace('.', ',')}% BF • ${bfTier.shortTitle}
                    </span>
                  ` : `
                    <span class="px-2.5 py-0.5 rounded-full bg-slate-200 dark:bg-[#1a2330] text-[11px] font-bold text-slate-500">
                      %BF não informado
                    </span>
                  `}
                  <span class="px-2.5 py-0.5 rounded-lg bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 text-[11px] font-bold">
                    ${diag.icon} ${diag.title}

                Treino de Hoje • ${DAY_SHORT[todayKey]} (${weekDates[todayKey]})
              </span>
              <span class="text-2xl">${todaySport.icon}</span>
            </div>
            <div>
              <p class="text-xs font-bold uppercase tracking-wider text-white/85">${escapeHtml(todayPlan.sport)}</p>
              <h2 class="font-display font-extrabold text-xl sm:text-2xl mt-0.5">${DAY_LABELS[todayKey]} — ${escapeHtml(todayPlan.title)}</h2>

                  ? `${todayPlan.exercises.length} exercício(s) na ficha • Cronômetro fixo na rolagem`

              Abrir Treino de Hoje →
            </button>
          </section>

          <!-- Card Calorias Totais & Gasto no Treino (calculado por peso, idade, sexo, %BF, séries, reps e carga) -->
          <section class="card-box rounded-2xl p-4 sm:p-5 space-y-3.5">
            <div class="flex flex-wrap items-start justify-between gap-2">
              <div>
                <h3 class="font-display font-extrabold text-sm sm:text-base flex items-center gap-1.5">
                  <span>🔥</span> Calorias Totais & Gasto no Treino

                </p>

            <div class="space-y-1.5">

                  <strong class="text-base sm:text-lg font-display text-emerald-600 dark:text-emerald-400">${totals.kcal.toLocaleString('pt-BR')}</strong>
                  <span class="text-slate-500 dark:text-slate-400"> / ${totalDailyCalorieTarget.toLocaleString('pt-BR')} kcal totais</span>
                </span>
                <span class="text-[11px] font-bold text-cyan-600 dark:text-cyan-400">
                  ${remainingKcal > 0 ? `Faltam ${remainingKcal.toLocaleString('pt-BR')} kcal` : 'Meta batida! 🎉'}
                </span>
              </div>
              <div class="w-full h-3 rounded-full bg-slate-200 dark:bg-[#0b0f14] overflow-hidden">
                <div class="h-full rounded-full bg-gradient-to-r from-emerald-500 via-teal-400 to-cyan-400 transition-all duration-300" style="width: ${kcalPct}%"></div>
              </div>
            </div>

            <!-- Detalhamento: Base + Gasto do Treino + Barra de Progresso do Treino -->
            <div class="grid grid-cols-3 gap-2 pt-0.5">
              <div class="rounded-xl p-2.5 bg-slate-50 dark:bg-[#0b0f14] border border-slate-200 dark:border-[#222d3b]">
                <div class="text-[10px] font-bold uppercase text-slate-500">Meta Base</div>
                <div class="font-display font-extrabold text-sm mt-0.5">${prof.calorieGoal.toLocaleString('pt-BR')} <span class="text-[10px] font-semibold text-slate-400">kcal</span></div>
              </div>
              <div class="rounded-xl p-2.5 bg-slate-50 dark:bg-[#0b0f14] border border-emerald-500/35">
                <div class="text-[10px] font-bold uppercase text-emerald-600 dark:text-emerald-400">Treino (${DAY_SHORT[burnDayKey]})</div>
                <div class="font-display font-extrabold text-sm text-emerald-600 dark:text-emerald-400 mt-0.5">+${activeBurn.burnedKcal} <span class="text-[10px] font-semibold">kcal</span></div>
              </div>
              <div class="rounded-xl p-2.5 bg-slate-50 dark:bg-[#0b0f14] border border-slate-200 dark:border-[#222d3b]">
                <div class="text-[10px] font-bold uppercase text-slate-500">Séries Feitas</div>
                <div class="font-display font-extrabold text-sm text-cyan-600 dark:text-cyan-400 mt-0.5">
                  ${activeBurn.totalSets > 0 ? `${activeBurn.doneSets}/${activeBurn.totalSets}` : (activeBurn.sportBurned > 0 ? 'Concluído' : '0')}
                </div>
              </div>
            </div>

            ${activeBurn.plannedKcal > 0 ? `
              <div class="space-y-1 pt-0.5">
                <div class="flex items-center justify-between text-[11px] font-semibold text-slate-500 dark:text-slate-400">
                  <span>Gasto estimado do treino (${DAY_LABELS[burnDayKey]})</span>
                  <span class="font-extrabold text-cyan-600 dark:text-cyan-400">${activeBurn.burnedKcal} / ${activeBurn.plannedKcal} kcal (${burnProgressPct}%)</span>
                </div>
                <div class="w-full h-2 rounded-full bg-slate-200 dark:bg-[#0b0f14] overflow-hidden">
                  <div class="h-full rounded-full bg-gradient-to-r from-cyan-500 to-emerald-400 transition-all duration-300" style="width: ${burnProgressPct}%"></div>
                </div>
              </div>
            ` : ''}
          </section>

          <!-- Grid: Calorias/Macros + Hidratação Diária Personalizada -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
            <!-- Dieta de Hoje -->
            <section class="card-box rounded-2xl p-4 space-y-3 flex flex-col justify-between">
              <div class="flex items-center justify-between gap-2">
                <div>
                  <h3 class="font-display font-extrabold text-sm sm:text-base">Dieta de Hoje</h3>
                  <p class="text-xs text-slate-500 dark:text-slate-400">
                    <strong class="text-emerald-600 dark:text-emerald-400">${totals.kcal.toLocaleString('pt-BR')}</strong> / ${totalDailyCalorieTarget.toLocaleString('pt-BR')} kcal
                    ${activeBurn.burnedKcal > 0 ? `<span class="text-[10px] font-bold text-cyan-500">(+${activeBurn.burnedKcal} treino)</span>` : ''}
                  </p>
                </div>
                <button onclick="MF.setTab('diet')" class="text-xs font-extrabold text-emerald-600 dark:text-emerald-400">Abrir →</button>
              </div>
              <div class="w-full h-2.5 rounded-full bg-slate-200 dark:bg-[#0b0f14] overflow-hidden">
                <div class="h-full rounded-full bg-gradient-to-r from-emerald-500 to-cyan-500" style="width: ${kcalPct}%"></div>
              </div>
              <div class="flex items-center justify-between text-xs font-bold text-slate-500 dark:text-slate-400">
                <span>P: <strong class="text-cyan-500">${totals.p}g</strong></span>
                <span>C: <strong class="text-emerald-500">${totals.c}g</strong></span>
                <span>G: <strong class="text-amber-500">${totals.g}g</strong></span>
              </div>
            </section>

            <!-- Hidratação Diária (peso * 35ml) -->
            <section class="card-box rounded-2xl p-4 space-y-3 flex flex-col justify-between">
              <div class="flex items-center justify-between gap-2">
                <div>
                  <h3 class="font-display font-extrabold text-sm sm:text-base">💧 Hidratação Diária</h3>
                  <p class="text-xs text-slate-500 dark:text-slate-400">
                    <strong class="text-cyan-500">${((prof.waterConsumedMl || 0) / 1000).toFixed(2).replace('.', ',')} L</strong> / ${(waterTarget / 1000).toFixed(2).replace('.', ',')} L <span class="text-[10px]">(35ml/kg)</span>
                  </p>
                </div>
                <button onclick="MF.addWater(250)"
                  class="px-2.5 py-1.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-display font-extrabold text-xs active:scale-95 transition">
                  +250 ml
                </button>
              </div>
              <div class="w-full h-2.5 rounded-full bg-slate-200 dark:bg-[#0b0f14] overflow-hidden">
                <div class="h-full rounded-full bg-gradient-to-r from-sky-500 to-cyan-400 transition-all duration-300" style="width: ${waterPct}%"></div>
              </div>
              <div class="flex items-center justify-between text-[11px] font-semibold text-slate-500 dark:text-slate-400">
                <span>${Math.floor((prof.waterConsumedMl || 0) / 250)} de ${Math.ceil(waterTarget / 250)} copos (250ml)</span>
                <span class="font-extrabold text-cyan-500">${waterPct}%</span>
              </div>
            </section>
          </div>

          <!-- Treinos da Semana -->
          <section class="space-y-2.5">
            <div class="flex items-center justify-between">
              <h3 class="font-display font-extrabold text-base sm:text-lg">Planilha da Semana</h3>
              <button onclick="MF.openEditScheduleModal()" class="text-xs font-extrabold text-cyan-600 dark:text-cyan-400 hover:underline">
                ✏️ Editar Planilha
              </button>
            </div>
            <div class="space-y-2">
              ${DAYS_ORDER.map(dKey => {
                const item = prof.schedule[dKey] || { sport: 'Descanso', title: 'Descanso', exercises: [] };
                const sp = SPORT_META[item.sport] || SPORT_META['Descanso'];
                const isToday = dKey === todayKey;
                return `
                  <button onclick="MF.openDayWorkout('${dKey}')"
                    class="w-full card-box rounded-2xl p-3.5 flex items-center justify-between gap-3 text-left hover:border-cyan-500/60 transition ${isToday ? 'ring-2 ring-cyan-500/40' : ''}">
                    <div class="flex items-center gap-3 min-w-0">
                      <div class="w-11 h-11 rounded-xl flex items-center justify-center text-xl border ${sp.badge} shrink-0">${sp.icon}</div>
                      <div class="min-w-0">
                        <div class="flex items-center gap-2">
                          <span class="font-display font-bold text-sm">${DAY_LABELS[dKey]}</span>
                          <span class="text-[11px] font-semibold px-2 py-0.5 rounded-md bg-slate-100 dark:bg-[#1a2330] text-slate-500 dark:text-slate-400">${weekDates[dKey]}</span>
                          ${isToday ? '<span class="px-1.5 py-0.5 rounded bg-emerald-500/15 text-emerald-500 text-[10px] font-extrabold">Hoje</span>' : ''}
                        </div>
                        <p class="text-xs text-slate-500 dark:text-slate-400 truncate mt-0.5">
                          <strong class="text-slate-700 dark:text-slate-200">${escapeHtml(item.sport)}:</strong> ${escapeHtml(item.title)}
                        </p>
                      </div>
                    </div>
                    <span class="text-xs font-bold text-cyan-600 dark:text-cyan-400 shrink-0">Abrir →</span>
                  </button>
                `;
              }).join('')}
            </div>
          </section>
        `;
      }

      // ======================== ABA 2: TREINOS ========================
      function renderWorkoutsTab(prof) {
        const dayPlan = prof.schedule[ui.selectedDay] || { sport: 'Musculação', title: 'Treino', sportLog: makeSportLog(), exercises: [] };
        const sportInfo = SPORT_META[dayPlan.sport] || SPORT_META['Musculação'];
        const presets = [30, 45, 60, 90, 120];
        const curMin = Math.floor(ui.timer.totalSeconds / 60);
        const curSec = ui.timer.totalSeconds % 60;
        const sLog = dayPlan.sportLog || makeSportLog();

        // Card específico para esportes (Vôlei, Tênis, Corrida, Natação) ou Descanso
        let modalityCardHTML = '';
        if (dayPlan.sport === 'Descanso') {
          modalityCardHTML = `
            <section class="card-box rounded-2xl p-5 space-y-2.5 border-dashed">
              <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl bg-slate-500/15 border border-slate-500/30 flex items-center justify-center text-2xl shrink-0">😴</div>
                <div>
                  <h3 class="font-display font-extrabold text-base">Dia de Recuperação Ativa</h3>
                  <p class="text-xs text-slate-500 dark:text-slate-400">O músculo cresce no descanso! Foque em hidratação, proteína e mobilidade leve.</p>
                </div>
              </div>
            </section>
          `;
        } else if (dayPlan.sport !== 'Musculação') {
          modalityCardHTML = `
            <section class="card-box rounded-2xl p-4 sm:p-5 space-y-3.5 ${sLog.done ? 'border-emerald-500/60' : ''}">
              <div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-2.5">
                  <span class="text-2xl">${sportInfo.icon}</span>
                  <div>
                    <h3 class="font-display font-extrabold text-base">Registro de ${escapeHtml(dayPlan.sport)}</h3>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Anote como foi sua sessão de hoje</p>
                  </div>
                </div>
                <button onclick="MF.toggleSportDone()"
                  class="px-3 py-2 rounded-xl font-display font-extrabold text-xs transition ${sLog.done
                    ? 'bg-emerald-500 text-slate-950'
                    : 'bg-slate-100 dark:bg-[#1a2330] border border-slate-300 dark:border-[#222d3b] text-slate-700 dark:text-slate-200 hover:border-emerald-500'}">
                  ${sLog.done ? '✓ Concluído' : 'Concluir Treino'}
                </button>
              </div>

              <div class="grid grid-cols-3 gap-2">
                <div>
                  <label class="text-[10px] font-bold uppercase text-slate-500">Duração (min)</label>
                  <input type="number" value="${sLog.duration || 60}" onchange="MF.updateSportLog('duration', this.value)"
                    class="mt-1 w-full rounded-xl bg-slate-50 dark:bg-[#0b0f14] border border-slate-300 dark:border-[#222d3b] px-2.5 py-2 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-cyan-500" />
                </div>
                <div>
                  <label class="text-[10px] font-bold uppercase text-slate-500">Intensidade</label>
                  <select onchange="MF.updateSportLog('intensity', this.value)"
                    class="mt-1 w-full rounded-xl bg-slate-50 dark:bg-[#0b0f14] border border-slate-300 dark:border-[#222d3b] px-2 py-2 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-cyan-500">
                    ${['Leve', 'Moderada', 'Intensa'].map(lv => `<option value="${lv}" ${sLog.intensity === lv ? 'selected' : ''}>${lv}</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label class="text-[10px] font-bold uppercase text-slate-500">${escapeHtml(sportInfo.metricLabel)}</label>
                  <input type="text" value="${escapeHtml(sLog.metric || '')}" placeholder="Ex: 5 km" onchange="MF.updateSportLog('metric', this.value)"
                    class="mt-1 w-full rounded-xl bg-slate-50 dark:bg-[#0b0f14] border border-slate-300 dark:border-[#222d3b] px-2.5 py-2 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-cyan-500" />
                </div>
              </div>

              <div>
                <label class="text-[10px] font-bold uppercase text-slate-500">Observações da sessão</label>
                <input type="text" value="${escapeHtml(sLog.notes || '')}" placeholder="Ex: Saque entrou bem, pace constante, energia alta..."
                  onchange="MF.updateSportLog('notes', this.value)"
                  class="mt-1 w-full rounded-xl bg-slate-50 dark:bg-[#0b0f14] border border-slate-300 dark:border-[#222d3b] px-3 py-2 text-xs sm:text-sm font-medium focus:outline-none focus:ring-2 focus:ring-cyan-500" />
              </div>
            </section>
          `;
        }

        // Lista limpa de exercícios (SEM botão "Descanso", COM botão ✕ discreto + Undo e + Série)
        let exercisesHTML = '';
        if (dayPlan.sport === 'Descanso') {
          exercisesHTML = `<p class="text-xs text-center text-slate-500 dark:text-slate-400 py-1">Dia configurado como <strong>Descanso</strong>. Para treinar neste dia, altere a modalidade em <strong>✏️ Editar Planilha</strong>.</p>`;
        } else if (dayPlan.exercises.length === 0) {
          exercisesHTML = dayPlan.sport === 'Musculação'
            ? `<div class="card-box rounded-2xl p-7 text-center space-y-2.5">
                <div class="text-3xl">${sportInfo.icon}</div>
                <p class="font-display font-bold text-base">Nenhum exercício cadastrado neste dia</p>
                <p class="text-xs text-slate-500 dark:text-slate-400">Toque em <strong>+ Exercício</strong> acima para montar seu treino.</p>
              </div>`
            : `<p class="text-xs text-center text-slate-500 dark:text-slate-400 py-1">Quer complementar com musculação ou mobilidade? Use <strong>+ Exercício</strong> acima.</p>`;
        } else {
          exercisesHTML = dayPlan.exercises.map((ex, idx) => {
            const isExDone = ex.logs.length > 0 && ex.logs.every(r => r.done);
            const exBurn = calculateExerciseBurn(prof, ex);
            return `
            <article class="${isExDone ? 'exercise-done-card' : 'card-box'} rounded-2xl p-4 sm:p-5 space-y-3.5">
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0">
                  <div class="flex flex-wrap items-center gap-2">
                    <h3 class="font-display font-extrabold text-base sm:text-lg truncate">${idx + 1}. ${escapeHtml(ex.name)}</h3>
                    ${isExDone ? `
                      <span class="px-2 py-0.5 rounded-full bg-gradient-to-r from-emerald-500 to-cyan-500 text-slate-950 text-[10px] font-extrabold shrink-0 shadow-xs">
                        ✓ Concluído
                      </span>
                    ` : ''}
                  </div>
                  <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5 flex flex-wrap items-center gap-2">
                    <span>Meta: <strong>${ex.logs.length} séries × ${escapeHtml(ex.reps)} reps</strong></span>
                    ${exBurn.burnedKcal > 0 ? `<span class="text-[11px] font-extrabold text-emerald-600 dark:text-emerald-400">• 🔥 ${exBurn.burnedKcal} kcal</span>` : ''}
                  </p>
                </div>
                <button onclick="MF.deleteExercise('${ex.id}')" title="Remover exercício" aria-label="Remover exercício"
                  class="w-8 h-8 rounded-xl bg-slate-100 dark:bg-[#1a2330] hover:bg-rose-500/15 text-slate-400 hover:text-rose-500 font-bold text-xs flex items-center justify-center transition shrink-0">
                  ✕
                </button>
              </div>

              <div class="grid grid-cols-12 gap-2 px-2 text-[10px] font-bold uppercase tracking-wider text-slate-400">
                <div class="col-span-2">Série</div>
                <div class="col-span-4 text-center">Carga (kg)</div>
                <div class="col-span-4 text-center">Reps Feitas</div>
                <div class="col-span-2 text-right">Feito</div>
              </div>

              <div class="space-y-2">
                ${ex.logs.map((row, sIdx) => `
                  <div class="grid grid-cols-12 items-center gap-2 p-2 rounded-xl bg-slate-50 dark:bg-[#0b0f14] border border-slate-200/80 dark:border-[#222d3b]">
                    <div class="col-span-2 text-xs font-extrabold text-slate-500 pl-1">#${sIdx + 1}</div>
                    <div class="col-span-4">
                      <input type="number" step="0.5" placeholder="kg" value="${escapeHtml(row.kg)}"
                        onchange="MF.updateSetLog('${ex.id}', ${sIdx}, 'kg', this.value)"
                        class="w-full rounded-lg bg-white dark:bg-[#141b24] border border-slate-300 dark:border-[#222d3b] px-2 py-2 text-center text-sm font-bold focus:outline-none focus:ring-2 focus:ring-cyan-500" />
                    </div>
                    <div class="col-span-4">
                      <input type="number" placeholder="reps" value="${escapeHtml(row.reps)}"
                        onchange="MF.updateSetLog('${ex.id}', ${sIdx}, 'reps', this.value)"
                        class="w-full rounded-lg bg-white dark:bg-[#141b24] border border-slate-300 dark:border-[#222d3b] px-2 py-2 text-center text-sm font-bold focus:outline-none focus:ring-2 focus:ring-cyan-500" />
                    </div>
                    <div class="col-span-2 flex justify-end">
                      <button onclick="MF.toggleSetDone('${ex.id}', ${sIdx})"
                        class="w-10 h-10 rounded-xl flex items-center justify-center border transition ${row.done
                          ? 'bg-emerald-500 border-emerald-400 text-slate-950 font-extrabold shadow-xs'
                          : 'bg-white dark:bg-[#141b24] border-slate-300 dark:border-[#222d3b] text-slate-400 hover:border-emerald-500/60'}">
                        ✓
                      </button>
                    </div>
                  </div>
                `).join('')}
              </div>

              <div class="flex items-center justify-between pt-1">
                <button onclick="MF.addSetToExercise('${ex.id}')"
                  class="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-[#1a2330] hover:bg-cyan-500/15 hover:text-cyan-500 text-xs font-bold text-slate-600 dark:text-slate-300 transition">
                  + Série
                </button>
                ${ex.logs.length > 1 ? `
                  <button onclick="MF.removeLastSetFromExercise('${ex.id}')"
                    class="px-2.5 py-1.5 rounded-lg text-[11px] font-bold text-slate-400 hover:text-rose-500 transition">
                    − Remover última série
                  </button>
                ` : ''}
              </div>
            </article>
          `;
          }).join('');
        }

        return `
          <!-- CRONÔMETRO DE DESCANSO (ÚNICO ELEMENTO STICKY AO ROLAR ATÉ O ÚLTIMO EXERCÍCIO) -->
          <section id="rest-timer-card" class="cronometro-sticky rounded-2xl border-2 border-cyan-500/55 p-4 transition-colors">
            <div class="flex flex-wrap items-center justify-between gap-2.5 mb-3">
              <div class="flex items-center gap-3">
                <div id="rest-timer-icon" class="w-11 h-11 rounded-xl bg-cyan-500/15 text-cyan-500 flex items-center justify-center text-lg shrink-0">⏱</div>
                <div>
                  <div class="text-[10px] font-extrabold uppercase tracking-wider text-slate-500 dark:text-slate-400">Cronômetro de Descanso</div>
                  <div id="rest-timer-clock" class="font-display font-extrabold text-3xl sm:text-4xl tracking-tight leading-none text-cyan-500">${formatClock(ui.timer.secondsLeft)}</div>
                </div>
              </div>
              <div class="flex items-center gap-1 bg-slate-100 dark:bg-[#0b0f14] border border-slate-200 dark:border-[#222d3b] rounded-xl px-2 py-1.5">
                <input id="custom-timer-min" type="number" min="0" max="59" value="${curMin}" aria-label="Minutos"
                  class="w-7 bg-transparent text-center font-bold text-xs sm:text-sm focus:outline-none" />

      // ======================== ABA 3: EVOLUÇÃO (DESIGN INTOCADO + DIAGNÓSTICO REAL + EXERCÍCIOS SINCRONIZADOS) ========================
      function buildExerciseChartSVG(points, metric) {
        const W = 560;
        const H = 210;
        const padL = 44;
        const padR = 18;
        const padT = 20;
        const padB = 34;
        const plotW = W - padL - padR;
        const plotH = H - padT - padB;

        const getVal = (pt) => {
          if (metric === 'reps') return Number(pt.reps) || 0;
          if (metric === 'volume') return Math.round((Number(pt.kg) || 0) * (Number(pt.reps) || 0));
          return Number(pt.kg) || 0;
        };

        const values = points.map(getVal);
        const minV = Math.min(...values);
        const maxV = Math.max(...values);
        const range = Math.max(1, maxV - minV);
        const yMin = Math.max(0, minV - range * 0.22);
        const yMax = maxV + range * 0.22;

        const coords = points.map((pt, i) => {
          const x = padL + (points.length === 1 ? plotW / 2 : (i / (points.length - 1)) * plotW);
          const v = getVal(pt);
          const y = padT + plotH - ((v - yMin) / Math.max(0.1, yMax - yMin)) * plotH;
          return { x, y, v, pt, i };
        });

        const linePath = coords.map((c, idx) => `${idx === 0 ? 'M' : 'L'} ${c.x.toFixed(1)} ${c.y.toFixed(1)}`).join(' ');
        const areaPath = coords.length > 1
          ? `${linePath} L ${coords[coords.length - 1].x.toFixed(1)} ${(padT + plotH).toFixed(1)} L ${coords[0].x.toFixed(1)} ${(padT + plotH).toFixed(1)} Z`
          : '';

        const gridLines = [0, 0.33, 0.66, 1].map(t => {
          const y = padT + plotH * t;
          const labelVal = Math.round(yMax - (yMax - yMin) * t);
          return `
            <line x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}" stroke="currentColor" stroke-opacity="0.12" stroke-dasharray="3 4" />
            <text x="${padL - 8}" y="${(y + 4).toFixed(1)}" text-anchor="end" fill="currentColor" fill-opacity="0.55" font-size="10" font-weight="600">${labelVal}</text>
          `;
        }).join('');

        const activeIdx = ui.activePointIdx !== null && coords[ui.activePointIdx] ? ui.activePointIdx : coords.length - 1;
        const sel = coords[activeIdx];
        const firstVal = coords[0].v || 0;
        const diffAbs = +(sel.v - firstVal).toFixed(1);
        const diffPct = firstVal > 0 ? Math.round(((sel.v - firstVal) / firstVal) * 100) : 0;
        const unit = metric === 'reps' ? 'reps' : (metric === 'volume' ? 'kg×reps' : 'kg');

        const dots = coords.map(c => {
          const isSel = c.i === activeIdx;
          return `
            <g class="cursor-pointer" onclick="MF.selectChartPoint(${c.i})">
              <circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="${isSel ? 13 : 9}" fill="#06b6d4" fill-opacity="${isSel ? 0.22 : 0.01}" />
              <circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="${isSel ? 6 : 4.5}" fill="${isSel ? '#10b981' : '#ffffff'}" stroke="#06b6d4" stroke-width="2.5" />
              <text x="${c.x.toFixed(1)}" y="${H - 10}" text-anchor="middle" fill="currentColor" fill-opacity="${isSel ? 0.95 : 0.55}" font-size="10" font-weight="${isSel ? '800' : '600'}">${escapeHtml(c.pt.date)}</text>
            </g>
          `;
        }).join('');

        return `
          <div class="space-y-2.5">
            <div class="flex flex-wrap items-center justify-between gap-2 px-3 py-2 rounded-xl bg-slate-100 dark:bg-[#0b0f14] border border-slate-200 dark:border-[#222d3b] text-xs">
              <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-cyan-500"></span>
                <span class="font-bold text-slate-600 dark:text-slate-300">Sessão ${escapeHtml(sel.pt.date)}:</span>
                <strong class="text-cyan-600 dark:text-cyan-400">${sel.v} ${unit}</strong>
                <span class="text-[11px] text-slate-400">(${sel.pt.kg}kg × ${sel.pt.reps}r)</span>
              </div>
              <span class="px-2 py-0.5 rounded-lg bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 font-extrabold text-[11px]">
                ${diffAbs >= 0 ? '+' : ''}${diffAbs} ${unit} (${diffPct >= 0 ? '+' : ''}${diffPct}%)
              </span>
            </div>

            <svg viewBox="0 0 ${W} ${H}" class="w-full h-auto text-slate-900 dark:text-slate-100 select-none">
              <defs>
                <linearGradient id="exLineGrad" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0%" stop-color="#06b6d4" />
                  <stop offset="100%" stop-color="#10b981" />
                </linearGradient>
                <linearGradient id="exAreaGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.34" />
                  <stop offset="100%" stop-color="#10b981" stop-opacity="0.02" />
                </linearGradient>
              </defs>
              ${gridLines}
              ${areaPath ? `<path d="${areaPath}" fill="url(#exAreaGrad)" />` : ''}
              ${coords.length > 1 ? `<path d="${linePath}" fill="none" stroke="url(#exLineGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />` : ''}
              ${dots}
            </svg>
          </div>
        `;
      }

          <!-- CARD DE DIAGNÓSTICO DINÂMICO (COERENTE COM OS DADOS REAIS DO USUÁRIO) -->
          <button onclick="MF.openDiagnosisModal()"

          <!-- GRÁFICO 1: PERCENTUAL DE GORDURA CORPORAL EM 9 FAIXAS (DESIGN APROVADO PRESERVADO) -->
